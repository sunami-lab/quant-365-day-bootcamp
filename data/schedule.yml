- day: 302
  date: '2027-06-04'
  weekday: Friday
  week: 44
  phase: Microstructure
  kind: study
  title: Capacity, recomputed with a fitted model
  why: Every capacity figure you have reported since week 25 rested on an assumed exponent and an assumed
    coefficient, and today both are measurements, which will move the numbers downward.
  objectives:
  - Report revised capacity for every signal in the book, with the change from the assumed model quantified.
  - State which assumption drove most of the change.
  tasks:
  - text: 'Produce the revision table: for each signal, old and new capacity in dollars, and the change
      attributed between the exponent, the coefficient and the volatility scaling. Attributing the change
      is more useful than reporting it, because it tells you which measurement to improve next.'
    minutes: 30
  - text: 'Recompute the combined book''s capacity, which is not the sum of the parts: signals that trade
      the same names compete for the same liquidity, so the book''s capacity is below the sum and the
      shortfall depends on the overlap. Compute the overlap explicitly from the position vectors rather
      than assuming independence.'
    minutes: 30
  resources:
  - label: Tóth et al. (2011) — Anomalous price impact and the critical nature of liquidity
    url: https://arxiv.org/abs/1105.1694
    kind: paper
  - label: Amihud (2002) — Illiquidity and stock returns
    url: https://www.cis.upenn.edu/~mkearns/finread/amihud.pdf
    kind: paper
  deliverable: The capacity revision table with the change attributed, plus a combined-book capacity that
    accounts for position overlap.
  checkpoint: Your book's capacity is below the sum of its signals' capacities. By how much, and what
    did you compute to find out?
  prep_for_tomorrow:
  - For each signal, plot net information ratio against assumed portfolio size using the fitted impact
