- day: 249
  date: '2027-04-12'
  weekday: Monday
  week: 36
  phase: Derivatives
  kind: study
  title: Risk-neutral is a change of measure, not a claim about people
  why: The most commonly misstated idea in derivatives, asked in interviews precisely because the wrong
    answer is so available, and the right answer is a statement about what the replication argument permits.
  objectives:
  - State what the risk-neutral measure is and what the replication argument lets you conclude about pricing
    under it.
  - Say what Girsanov's theorem changes and what it leaves invariant, without needing to prove it.
  tasks:
  - text: Read the treatment of the equivalent martingale measure in the Etheridge or van Handel notes,
      as far as the statement of Girsanov. The content you need is that changing measure changes the drift
      and leaves the volatility alone, and that the discounted price of a traded asset is a martingale
      under the new measure.
    minutes: 35
  - text: 'Write the correct answer in three sentences: the price of a replicable claim equals the cost
      of its replicating portfolio, that cost happens to equal a discounted expectation under a particular
      measure, and that measure is the one under which the discounted stock is a martingale. Nobody is
      assumed to be risk neutral anywhere in that chain.'
    minutes: 15
  - text: 'Check the invariance numerically: simulate the same paths under two drifts with identical volatility,
      and confirm that the quadratic variation, and hence the implied volatility, is unchanged. Volatility
      is the same under both measures and that is why it is the parameter you can estimate from prices.'
    minutes: 10
