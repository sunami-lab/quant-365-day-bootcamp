    minutes: 30
  - text: 'Choose and implement a partitioning scheme, then check the failure mode: too many small partitions
      makes metadata dominate. Report the file count, the average file size, and the query time across
      three schemes, and pick from the measurements.'
    minutes: 30
  resources:
  - label: PyArrow documentation
    url: https://arrow.apache.org/docs/python/
    kind: tool
  - label: DuckDB documentation
    url: https://duckdb.org/docs/current/
    kind: tool
  deliverable: Bytes read measured for three access patterns, and a partitioning scheme chosen from a
