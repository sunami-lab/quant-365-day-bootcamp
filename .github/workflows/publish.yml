name: Publish site

# Live. The repository is public, so Pages will serve it on the free organisation
# plan, and the repository variable PUBLISH_PAGES is set to `true`
# (Settings -> Secrets and variables -> Actions -> Variables).
#
# Renders on every push to main and pushes _site/ to the `gh-pages` branch, which
# Pages serves from the branch root. The site is at
# https://sunami-lab.github.io/quant-365-day-bootcamp/, which is also the site-url
# in _quarto.yml, where open-graph tags and absolute links resolve from.
#
# To take the site down, set PUBLISH_PAGES to anything other than `true`. That
# stops the deploy but leaves the already-published gh-pages branch being served,
# so delete that branch too if you need the site actually gone.

on:
    push:
        branches: ["main"]
    workflow_dispatch:

permissions:
    contents: write

jobs:
    build-deploy:
        if: vars.PUBLISH_PAGES == 'true'
        runs-on: ubuntu-latest
        steps:
            - name: Check out repository
              uses: actions/checkout@v5

            - name: Set up Quarto
              uses: quarto-dev/quarto-actions/setup@v2

            - name: Render site
              run: quarto render

            - name: Publish to gh-pages
              uses: quarto-dev/quarto-actions/publish@v2
              with:
                  target: gh-pages
                  path: _site
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
