- day: 328
  date: '2027-06-30'
  weekday: Wednesday
  week: 47
  phase: Production
  kind: study
  title: The first unattended run, and what it got wrong
  why: A pipeline that works when you run it by hand and a pipeline that works when it runs itself are
    different pipelines, and the difference shows up in the environment rather than in the code.
  objectives:
  - Diagnose the first unattended run entirely from its logs and monitors, without rerunning it.
  - Fix whatever broke and say which category of failure it was.
  tasks:
  - text: 'Read the logs before touching anything: what ran, what each step took, what the monitors said,
      and what the reconciliation reported. Diagnosing from logs alone is the skill being tested, and
      if you cannot, the logging work from day 324 is incomplete rather than the run being at fault.'
    minutes: 30
  - text: 'Fix what broke, which will be an environment difference: a path that resolved differently,
      a credential not in the scheduler''s environment, a timezone assumption, or a dependency on a shell
      profile. Write which category it was into the runbook, because the next one will be from the same
      list.'
    minutes: 30
  resources:
  - label: Docker — get started
    url: https://docs.docker.com/get-started/
    kind: course
  - label: uv documentation (Astral)
    url: https://docs.astral.sh/uv/
    kind: tool
  deliverable: A diagnosed and fixed first unattended run, with the failure category added to the runbook.
  checkpoint: What broke on the first unattended run, and could you tell from the logs alone?
  prep_for_tomorrow:
  - Let it run again tomorrow morning and do not intervene.
  - Reread reports/milestone-10-production.md and mark what is still notes.
  - Check your timed mixed-set scores; tomorrow is the eighth sitting.
  project: The pipeline runs unattended on a schedule, and the first failure is diagnosed from logs alone
    and fixed, with the failure category recorded in the runbook.
- day: 329
  date: '2027-07-01'
  weekday: Thursday
  week: 47
  phase: Production
  kind: milestone
  milestone: The system in production
  title: 'Milestone: the system in production'
  why: The strategy running by itself against a real broker's paper account, and the test is whether it
    survives a week you do not touch it, which starts today rather than ends today.
  objectives:
  - Have the full pipeline run on a schedule with logging, monitoring, alerting and reconciliation, unattended.
  - Have a runbook covering the failures that will happen, written before they do.
  tasks:
  - text: 'Finish reports/milestone-10-production.md: the scheduled steps with their success conditions,
