      fill, no fill outside the session''s price range, and costs always non-negative. Run each over many
      random inputs rather than one.'
    minutes: 35
  - text: 'Push until something breaks: feed the engine a session with zero volume, a price of zero, a
      missing bar mid-series, and a strategy that orders more than exists. Each should either be handled
      or fail loudly. A silent pass on any of them is a bug waiting for phase 10.'
    minutes: 25
  resources:
  - label: pytest documentation
    url: https://docs.pytest.org/en/stable/
    kind: tool
  - label: NautilusTrader documentation
    url: https://nautilustrader.io/docs/
    kind: tool
