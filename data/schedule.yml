- day: 358
  date: '2027-07-30'
  weekday: Friday
  week: 52
  phase: Capstone
  kind: study
  title: The track record, reported without adjustment
  why: Four weeks of live paper trading is not enough to conclude anything and it is enough to be honest
    about, and the reporting standard you set today is the one the whole capstone rests on.
  objectives:
  - Report the paper account's performance with every period included and no exclusions.
  - State what a track record of this length can and cannot support, with the standard error attached.
  tasks:
  - text: 'Produce the track record table: monthly returns with no month omitted, cumulative return, realised
      volatility, maximum drawdown, and turnover. Then attach the Sharpe standard error at this sample
      length from qlib/stats.py, which will be wide enough that the point estimate carries almost no information,
      and say so on the same page rather than in a footnote.'
    minutes: 30
  - text: 'Reconcile it against the broker: the account''s own statements against your engine''s derived
      positions and cash, using the day 327 reconciliation. Any difference that cannot be explained goes
      into the report as an unexplained residual rather than being absorbed into a rounding line.'
    minutes: 25
  - text: Write the one-sentence statement of what this record supports, which is that the system runs
      and produces the positions it intends, rather than that the strategy works.
    minutes: 10
  resources:
  - label: Alpaca — paper trading documentation
    url: https://docs.alpaca.markets/docs/paper-trading
    kind: tool
  - label: empyrical-reloaded — Sharpe, Sortino, drawdown primitives
    url: https://github.com/stefan-jansen/empyrical-reloaded
    kind: repo
  deliverable: The unadjusted track record table with a broker reconciliation and the Sharpe standard
    error at this sample length.
  checkpoint: Your live Sharpe is 1.3 over four weeks. What is its standard error, and what does the record
    actually support?
  prep_for_tomorrow:
  - Run the backtest over exactly the live period and put its daily returns next to the live ones.
  - Compute the correlation and the difference in mean return.
  - Two numbers, and do not explain them tonight.
  project: The live paper track record is reported with every period included and reconciled against the
    broker's own statements, with the Sharpe standard error at this sample length stated on the same page
    as the estimate.
- day: 359
  date: '2027-07-31'
  weekday: Saturday
  week: 52
  phase: Capstone
  kind: study
  title: Where the live period disagreed with the backtest
  why: If the two disagree, that disagreement is the most interesting result of the year and it goes at
    the front of the capstone, because it is the only genuinely out-of-sample evidence you have.
  objectives:
  - Decompose the difference between live and backtested returns into signal, execution and universe components.
  - Say which component was largest and whether you would have predicted it.
  tasks:
  - text: 'Decompose it properly rather than attributing it to noise: run the backtest with the live period''s
      actual fills substituted for its modelled fills, which isolates execution, then with the live universe
      substituted, which isolates selection. What remains is signal difference plus noise, and the three
      parts should sum to the total.'
    minutes: 35
  - text: 'Check the prediction: your milestone 5 list of lies ranked what would matter most, and this
      decomposition is the first real test of that ranking. Report whether the largest component was where
      you predicted, and update the list either way.'
    minutes: 25
  resources:
  - label: Alpaca — paper trading documentation
    url: https://docs.alpaca.markets/docs/paper-trading
    kind: tool
  - label: Rob Carver — This Blog is Systematic
    url: https://qoppac.blogspot.com/
    kind: reference
  deliverable: A three-way decomposition of the live-backtest difference with the components reconciling
    to the total.
  checkpoint: Your live returns are 30 basis points a month below the backtest. Which component was it,
    and did your milestone 5 ranking predict that?
  prep_for_tomorrow:
  - List the eleven milestone documents and, for each, the one sentence you would keep if you could keep
    only one.
  - Eleven sentences.
  - That list is the skeleton of tomorrow's dossier.
  project: The live-against-backtest difference is decomposed into execution, universe and signal components
    that sum to the total, which is the first empirical test of the ranked list of lies from milestone
    5.
