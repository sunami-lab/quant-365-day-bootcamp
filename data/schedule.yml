    url: https://dachxiu.chicagobooth.edu/download/ML.pdf
    kind: paper
  deliverable: Gross and net results with turnover for every model, the cost curve on one axis, and the
    turnover penalty tested.
  checkpoint: Your boosting model wins gross by 20 percent and loses net. What is the mechanism, and did
    the turnover penalty fix it?
  prep_for_tomorrow:
  - Split the test period into four sub-periods and report each model's performance in each.
  - Note whether the winner is the same in all four.
  - It probably is not.
- day: 236
  date: '2027-03-30'
  weekday: Tuesday
  week: 34
  phase: Machine learning
  kind: study
  title: When the flexible model wins, and when it does not
  why: A single average hides the conditional structure, and knowing which regimes each model wins in
    is more useful than knowing which won overall.
  objectives:
  - Report each model's performance conditional on volatility regime, on dispersion, and on sub-period.
  - State whether the conditional pattern is stable enough to act on, using an interval rather than an
    eyeball.
  tasks:
  - text: 'Run the conditional analysis: performance by volatility tercile, by cross-sectional dispersion
      tercile, and by sub-period, for every model, with intervals throughout. Then count how many conditional
      comparisons you have just made, since this is a place where conditioning can generate an apparent
      pattern out of nothing.'
    minutes: 35
  - text: 'Test the pattern rather than describing it: if the flexible model appears to win in high-dispersion
      periods, check whether that holds in the validation period too. A conditional effect that appears
      only in the test period is a conditional effect you found by looking.'
    minutes: 25
  resources:
  - label: Bailey & López de Prado (2014) — The Deflated Sharpe Ratio
    url: https://www.davidhbailey.com/dhbpapers/deflated-sharpe.pdf
