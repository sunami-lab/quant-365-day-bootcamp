      is the most convincing part.'
    minutes: 30
  - text: 'Set the real test running: commit to not touching the system for the next week and note the
      date. The milestone''s claim is that it survives a week unattended, and you cannot assert that today.
      Write the date the claim can be checked and put it in the capstone''s checklist.'
    minutes: 20
  resources:
  - label: Alpaca — paper trading documentation
    url: https://docs.alpaca.markets/docs/paper-trading
