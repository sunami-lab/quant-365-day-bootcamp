- day: 244
  date: '2027-04-07'
  weekday: Wednesday
  week: 35
  phase: Derivatives
  kind: study
  title: Simulating an SDE, and measuring the discretisation error
  why: Every pricing method in week 39 is a simulation, so knowing the error of your integrator, and that
    it has two different rates depending on what you are measuring, prevents a class of silent inaccuracy.
  objectives:
  - Implement the Euler-Maruyama scheme and measure its strong and weak convergence rates against the
    exact solution.
  - Say which rate matters for pricing an option and which matters for hedging a path.
  tasks:
  - text: 'Implement the scheme in qlib/derivatives/sde.py and measure both errors against the exact geometric
      Brownian motion solution: strong error as the mean absolute path difference, and weak error as the
      difference in the mean of a function of the terminal value. Plot both against the step size on log
      axes and read off the two slopes.'
    minutes: 35
  - text: 'Say which one you need: pricing depends on the distribution of the terminal value, so weak
      convergence is what matters and it is the faster of the two rates. Path-dependent hedging depends
      on the path, so strong convergence matters there and it is slower. Getting this wrong makes people
      use far smaller steps than they need for a European price.'
    minutes: 15
  - text: Implement the exact simulation for geometric Brownian motion too, since it exists, and note
      that using the exact scheme where one is available removes the question entirely.
    minutes: 10
