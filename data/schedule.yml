  - text: 'Show what it changes: recompute the standard error of your out-of-sample R-squared using the
      effective sample size rather than the row count, and note how many model comparisons that reclassifies
      from significant to indistinguishable. This is the same correction as clustering standard errors,
      applied to a machine learning workflow that usually does not do it at all.'
    minutes: 25
  - text: 'Note the second use: bagging with a sample size set by uniqueness rather than by the row count,
      which is where tomorrow starts.'
