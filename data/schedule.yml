      cross-section rather than globally, so you break its relationship to the label without destroying
      the cross-sectional structure. Then repeat many times to get a null distribution per feature, not
      a point estimate.'
    minutes: 35
  - text: 'Handle the correlated-feature problem: permuting one of two correlated features leaves the
      model able to use the other, so both look unimportant. Run grouped permutation for correlated clusters
      and report both the individual and the grouped results, since the difference is itself informative.'
    minutes: 25
