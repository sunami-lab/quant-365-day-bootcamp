    account in phase 10.
- day: 299
  date: '2027-06-01'
  weekday: Tuesday
  week: 43
  phase: Microstructure
  kind: study
  title: Measuring your own slippage, against your own decisions
  why: Everything so far has been other people's fills; today the measurement points at you, which is
    the only version that will still be true in phase 10.
  objectives:
  - Record decision price, arrival price and fill price for your own orders and compute shortfall for
    each.
  - Attribute your measured slippage into spread, impact and timing components.
  tasks:
  - text: 'Build the recording path: your engine already writes fills.parquet, so extend it to record
      the decision timestamp and the prevailing mid at decision, at submission and at fill. Without those
      three the attribution is not possible and retrofitting them later means losing the data in between.'
    minutes: 35
  - text: Place a set of paper orders across a range of sizes and names, then compute and attribute the
      shortfall for each. With small orders the impact term will be indistinguishable from zero and the
      spread and timing terms will dominate, which is itself a finding about what matters at your size.
    minutes: 25
  resources:
  - label: Alpaca — paper trading documentation
    url: https://docs.alpaca.markets/docs/paper-trading
    kind: tool
  - label: ib_async — Interactive Brokers API (successor to ib_insync)
    url: https://github.com/ib-api-reloaded/ib_async
    kind: repo
  deliverable: Extended fill recording with three timestamps and mids, plus measured and attributed shortfall
    on a set of real paper orders.
  checkpoint: For your own orders, what fraction of slippage was spread, what fraction timing, and what
    fraction impact?
  prep_for_tomorrow:
  - Collect every fill you have from the paper account and count them.
  - It will not be many. Note the number.
  - Tomorrow is about what you can and cannot estimate from that sample size.
  project: The engine records decision, submission and fill timestamps with the prevailing mid at each,
    so implementation shortfall is measurable on the paper account from today rather than reconstructed
    later.
- day: 300
  date: '2027-06-02'
  weekday: Wednesday
  week: 43
  phase: Microstructure
  kind: study
  title: Fitting an impact coefficient to a sample of forty fills
  why: You now have real fills and far too few of them, which makes this the right day to be precise about
    what a small sample can support rather than to fit a model anyway.
  objectives:
  - Estimate the impact coefficient from your own fills with an honest confidence interval.
  - State what sample size you would need for the estimate to be useful, and what you will do until then.
  tasks:
  - text: 'Fit what you can: regress measured slippage on participation with the volatility scaling, using
      your own fills, and report the coefficient with its interval. The interval will be wide enough to
      include zero and also to include twice the published value, which is the correct conclusion from
      forty observations.'
    minutes: 30
  - text: 'Compute the requirement: given the residual variance you observe, how many fills would you
      need for a 20 percent relative standard error on the coefficient? Then state the interim policy,
      which is to use the coefficient fitted to the ITCH sample in week 42 and to report your own estimate
      alongside it as it accumulates.'
    minutes: 25
  - text: 'Set up the accumulation: a standing job that appends every new fill to the estimation dataset,
      so that by the capstone you have a real number rather than a plan to get one.'
    minutes: 10
  resources:
  - label: Tóth et al. (2011) — Anomalous price impact and the critical nature of liquidity
    url: https://arxiv.org/abs/1105.1694
    kind: paper
  - label: Alpaca — paper trading documentation
    url: https://docs.alpaca.markets/docs/paper-trading
    kind: tool
  deliverable: An impact coefficient from your own fills with an interval, the required sample size computed,
    and a standing accumulation job.
  checkpoint: Your own impact estimate has an interval spanning zero to twice the published value. What
    do you use, and what do you report?
  prep_for_tomorrow:
  - List the four execution measurements you now have and one line each on what they are for.
  - Check your timed mixed-set scores.
  - Nothing to install.
