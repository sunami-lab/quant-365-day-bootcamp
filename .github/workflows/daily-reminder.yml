name: Daily reminder email

# 22:00 UTC every day: 5 pm in Madison from March to November, 4 pm in winter.
#
# The 50-day LLM bootcamp pinned the send to exactly 5 pm local by starting the
# cron early and sleeping off the difference. It could afford to: Actions minutes
# are free on public repositories. This one was private when it was written, where
# they are metered and sleeping three hours a day would have spent the whole
# monthly allowance on doing nothing, so it sends whenever the runner starts
# instead. The repository is public now and the sleep would be free again, but
# drifting an hour with the seasons is not worth a job that idles for three hours.
# GitHub's scheduler also runs late under load, which moves the email later in the
# evening but never skips it.

on:
    schedule:
        - cron: "0 22 * * *"
    workflow_dispatch:
        inputs:
            dry_run:
                description: "Print the email instead of sending it"
                type: boolean
                default: false
            today:
                description: "Pretend today is this date (YYYY-MM-DD), for testing"
                type: string
                default: ""

permissions:
    contents: read

jobs:
    send:
        runs-on: ubuntu-latest
        steps:
            - name: Check out repository
              uses: actions/checkout@v5

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: Install PyYAML
              run: pip install --quiet pyyaml

            - name: Send reminder
              env:
                  GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
                  GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
                  RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
              run: |
                  ARGS=""
                  if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
                  if [ -n "${{ inputs.today }}" ]; then ARGS="$ARGS --today ${{ inputs.today }}"; fi
                  python scripts/send_reminder.py $ARGS
