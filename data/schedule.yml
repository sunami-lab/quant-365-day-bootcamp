- day: 311
  date: '2027-06-13'
  weekday: Sunday
  week: 45
  phase: Production
  kind: study
  title: Parquet, partitioning, and only reading what you need
  why: Columnar storage with predicate pushdown means a well-designed layout reads a fraction of the bytes,
    and the difference between a good and a bad partitioning is a factor you measured last night.
  objectives:
  - Explain predicate pushdown and column pruning, and demonstrate both with measured bytes read.
  - Choose a partitioning scheme for your own store and defend it against the query pattern.
