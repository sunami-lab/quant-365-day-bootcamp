# 365-Day Quant Bootcamp -- single source of truth.
# Calendar fields come from scripts/skeleton.py; content is merged by scripts/merge.py.
# Edit here, then run: python3 scripts/build.py

meta:
  title: 365-Day Quant Bootcamp
  start_date: '2026-08-07'
  end_date: '2027-08-06'
  timezone: America/Chicago
  day_url_template: https://github.com/sunami-lab/quant-365-day-bootcamp/blob/main/days/{slug}.qmd
  prep_for_day_1:
  - 'Create the Python 3.12 environment and install the core stack. The Setup page has the exact commands:
    it is one uv venv and one uv pip install, about ten minutes.'
  - Open a free Alpaca account. It takes five minutes, it is the broker the running strategy eventually
    trades against, and approval is not instant.
  - Create the private quant-365-work repository with the directory layout on the Setup page, and put
    a .gitignore in it before anything else. Data never gets committed.
  - Email the Wisconsin School of Business about a WRDS account. If UW-Madison's subscription covers you,
    that single form is worth more than every paid data API combined.
days:
- day: 1
  date: '2026-08-07'
  weekday: Friday
  week: 1
  phase: Markets
  kind: study
  title: Who pays whom, and for what
  why: You cannot yet tell a market maker from a pod shop from an allocator, and that distinction is what
    decides which firms you write to in eleven months.
  objectives:
  - Name six distinct businesses that operate in markets and, for each, say in one sentence where the
    revenue comes from.
  - Say which of the six you are competing with as one person with a laptop, and which you are not.
  tasks:
  - text: Read the free introduction chapter of Pedersen's Efficiently Inefficient, all of it, in one
      sitting. It is the best short account of what each kind of firm does that exists outside a paywall.
    minutes: 30
  - text: 'Open reports/milestone-01-market-map.md in the work repo and draw the map: exchange, broker,
      clearing house, market maker, prop shop, multi-manager pod, long-only manager, allocator. Put an
      arrow for every payment and label it with what is being bought.'
    minutes: 25
  resources:
  - label: Pedersen — Efficiently Inefficient, free introduction chapter
    url: http://assets.press.princeton.edu/chapters/i10441.pdf
    kind: reference
  - label: Pedersen — Efficiently Inefficient (Princeton UP)
    url: https://press.princeton.edu/books/hardcover/9780691166193/efficiently-inefficient
    kind: textbook
  deliverable: reports/milestone-01-market-map.md, started, with a first-pass diagram and at least six
    labelled payment arrows.
  checkpoint: Where does a market maker's revenue come from, and what is the risk it is being paid to
    carry?
  prep_for_tomorrow:
  - Activate the quant environment and run `python -c "import yfinance, duckdb; print('ok')"`. Fix it
    tonight if it fails, not tomorrow morning.
  - Download AAPL daily bars from 2019-01-01 to today with yfinance and save them to data/scratch/aapl_raw.parquet.
    Use `auto_adjust=False` this time.
  - Skim the yfinance README so you know which arguments exist before you need them.
- day: 2
  date: '2026-08-08'
  weekday: Saturday
  week: 1
  phase: Markets
  kind: study
  title: What a share obliges each side to do
  why: A price series is the shadow of a legal contract, and every data problem in week 3 comes from the
    contract, not from the data vendor.
  objectives:
  - State what a common share entitles you to and what it obliges you to, in four clauses, without using
    the word investment.
  - Point at the 2020 Apple split in a raw price series and say why the price fell 75 percent on a day
    nobody lost money.
  tasks:
  - text: Watch the equity valuation lecture from MIT 15.401 (Lo) up to the point where dividend discounting
      starts. Stop there; discounting is day 6. You want the definition of the claim, not the model of
      its value.
    minutes: 30
  - text: Plot data/scratch/aapl_raw.parquet close prices over 2019-2021. Find the 31 August 2020 four-for-one
      split, and print the raw close on 28 and 31 August. Write the two numbers in your notebook with
      the ratio between them.
    minutes: 20
  - text: 'Write four clauses in reports/milestone-01-market-map.md under a Glossary heading: what a share
      obliges the company to do, what it obliges you to do, what it entitles you to, and what happens
      in bankruptcy.'
    minutes: 10
  resources:
  - label: MIT 15.401 — Finance Theory I (Andrew Lo), video lectures and slides
    url: https://ocw.mit.edu/courses/15-401-finance-theory-i-fall-2008/pages/video-lectures-and-slides/
    kind: course
  - label: yfinance
    url: https://github.com/ranaroussi/yfinance
    kind: repo
  deliverable: notebooks/day-002-share-contract.ipynb with the split plot, plus the four-clause glossary
    entry for a share.
  checkpoint: A company pays a dividend of 2 dollars on a 100 dollar stock. What happens to the share
    price at the open, and who is worse off?
  prep_for_tomorrow:
  - Download SPY, VOO and IVV daily bars from 2015 to today into data/scratch/. Three ETFs on the same
    index; tomorrow asks why their prices differ.
  - Open the SPDR S&P 500 ETF fact sheet from the issuer's site and find the line that reports the fund's
    expense ratio.
  - Note in your notebook what you currently think keeps an ETF's price near the value of what it holds.
    You will check that guess tomorrow.
- day: 3
  date: '2026-08-09'
  weekday: Sunday
  week: 1
  phase: Markets
  kind: study
  title: The arbitrage that keeps an ETF near its NAV
  why: An ETF is the first instrument in the year whose price is held in place by someone else's profit
    motive, and that mechanism is the template for half of what follows.
  objectives:
  - Describe creation and redemption in the order the steps happen, and name who is paid at each step.
  - Say what breaks the mechanism, and name one asset class where the premium or discount routinely gets
    large.
  tasks:
  - text: Read the ETF section of the Efficiently Inefficient introduction chapter again, then work out
      on paper what an authorised participant does when the ETF trades 30 basis points above the value
      of its holdings. Write the trade as a sequence of buys, sells and deliveries.
    minutes: 25
  - text: Compute the daily return correlation and the tracking difference between SPY, VOO and IVV over
      2015-today. They track the same index; report the annualised gap between each pair in basis points.
    minutes: 25
  - text: 'Write two paragraphs in the glossary: what an ETF obliges the issuer to do, and the one sentence
      explaining why a bond ETF can trade at a 5 percent discount in a crisis while SPY does not.'
    minutes: 10
  resources:
  - label: Pedersen — Efficiently Inefficient, free introduction chapter
    url: http://assets.press.princeton.edu/chapters/i10441.pdf
    kind: reference
  - label: yfinance
    url: https://github.com/ranaroussi/yfinance
    kind: repo
  deliverable: notebooks/day-003-etf-mechanism.ipynb reporting three pairwise tracking differences in
    basis points a year.
  checkpoint: SPY trades at 401 while the basket is worth 400. Walk the authorised participant's trade,
    and say what they are exposed to in between.
  prep_for_tomorrow:
  - 'Open the CME page for the E-mini S&P 500 contract and write down four numbers: contract multiplier,
    tick size, tick value, and the expiry months.'
  - Pull the front-month and second-month continuous ES series if you have access to any; if not, note
    that you do not, because tomorrow's roll exercise needs two contracts.
  - Skim the exchange_calendars README to see how it names markets. You will use it from week 3 onward.
- day: 4
  date: '2026-08-10'
  weekday: Monday
  week: 1
  phase: Markets
  kind: study
  title: A future settles every night, and that changes everything
  why: Daily mark-to-market is the difference between a futures position and every other leveraged position
    you will ever hold, and it is where the roll, the margin call and the funding cost all come from.
  objectives:
  - List every cash flow between buying one E-mini S&P future and its expiry, including the ones that
    happen daily.
  - Given a contango curve, say what the roll does to a long position's return and why it is not the same
    as losing money.
  tasks:
  - text: Watch the forwards and futures lecture from MIT 15.401. It covers the contract, margin, and
      the cost-of-carry relation in one sitting, which is exactly today's scope.
    minutes: 35
  - text: 'On paper: you buy one E-mini S&P at 5,000 with the multiplier of 50 dollars per index point.
      The index closes at 4,960, then 5,020, then 5,010, then expires at 4,990. Write the variation margin
      cash flow on each of the four nights, and the total. Check that the total equals the multiplier
      times the change in index level.'
    minutes: 20
  resources:
  - label: MIT 15.401 — Finance Theory I (Andrew Lo), video lectures and slides
    url: https://ocw.mit.edu/courses/15-401-finance-theory-i-fall-2008/pages/video-lectures-and-slides/
    kind: course
  - label: exchange_calendars — 50+ exchange trading calendars
    url: https://github.com/gerrymanoim/exchange_calendars
    kind: repo
  deliverable: A four-line variation margin table in notebooks/day-004-futures.ipynb whose total reconciles
    to the multiplier times the index change.
  checkpoint: Name every cash flow of a long E-mini position from trade to expiry, then do the same for
    250,000 dollars of SPY. Which one has a funding cost you can see?
  prep_for_tomorrow:
  - Fetch https://cdn.cboe.com/api/global/delayed_quotes/options/AAPL.json and save it. It is one HTTP
    request and it gives you a full delayed option chain with greeks.
  - Look at the JSON structure for five minutes and find where strike, expiry, bid, ask and delta live.
    Do not try to interpret the greeks yet.
  - Draw, on paper, what you think the payoff at expiry of a bought call looks like. You will check it
    tomorrow.
- day: 5
  date: '2026-08-11'
  weekday: Tuesday
  week: 1
  phase: Markets
  kind: study
  title: A put is an obligation you sold, not a bet you made
  why: Options are the only instrument this year where the two sides have completely different risk, and
    getting that asymmetry into your hands now makes phase 8 a mathematics problem rather than a vocabulary
    problem.
  objectives:
  - Draw the four basic payoff diagrams at expiry from memory, with the axes labelled and the break-even
    marked.
  - Say what the seller of a put is obliged to do, when, and what their worst case is in dollars.
  tasks:
  - text: Watch the options lecture from MIT 15.401 as far as payoff diagrams and put-call parity. Stop
      before any pricing model. Pricing is week 36 and you will do it properly there.
    minutes: 30
  - text: From the saved AAPL chain, pick the nearest expiry and build the payoff at expiry of a bought
      call, a sold call, a bought put and a sold put at the closest-to-spot strike, using the mid of bid
      and ask as the premium. Plot all four on one figure and mark the break-evens.
    minutes: 25
  resources:
  - label: MIT 15.401 — Finance Theory I (Andrew Lo), video lectures and slides
    url: https://ocw.mit.edu/courses/15-401-finance-theory-i-fall-2008/pages/video-lectures-and-slides/
    kind: course
  - label: Cboe delayed option chains (JSON, with greeks)
    url: https://cdn.cboe.com/api/global/delayed_quotes/options/AAPL.json
    kind: data
  deliverable: notebooks/day-005-option-payoffs.ipynb with four payoff diagrams built from a real chain,
    break-evens marked.
  checkpoint: You sold a 190-strike put on a 200 stock for 4 dollars. What is your worst case, and what
    has to happen for it?
  prep_for_tomorrow:
  - Register for a FRED API key at the St. Louis Fed and put it in your shell profile as FRED_API_KEY.
    It takes two minutes and is free.
  - Install fredapi into the quant environment.
  - Pull the DGS3MO, DGS2 and DGS10 series and save them. Tomorrow you plot a yield curve from them.
- day: 6
  date: '2026-08-12'
  weekday: Wednesday
  week: 1
  phase: Markets
  kind: study
  title: A bond is a schedule, and FX is a relative price
  why: 'The last two instrument families, and the two you will use as inputs rather than trade: the curve
    sets the discount rate behind everything in phase 4, and FX is where carry is easiest to see.'
  objectives:
  - Given a bond's coupon, face value and maturity, write out its cash flow schedule and say what its
    price being below par tells you.
  - State what a spot FX trade obliges each side to deliver, and where the interest rate differential
    shows up.
  tasks:
  - text: Watch the fixed income lecture from MIT 15.401 through discounting, yield to maturity and duration.
      Duration is the one concept here you will reuse, in phase 4, as a first-order sensitivity.
    minutes: 30
  - text: 'Plot the US Treasury curve from FRED on three dates you choose: one in 2019, one in mid-2020,
      and the most recent. Use DGS3MO, DGS2, DGS10 and DGS30. Say in one line which of the three is inverted
      and what that means as a statement about expected short rates.'
    minutes: 20
  - text: 'Write the FX entry in the glossary: what EURUSD 1.08 means operationally, who delivers what
      in two business days, and the one sentence linking the forward points to the two countries'' interest
      rates.'
    minutes: 10
  resources:
  - label: FRED API documentation (St. Louis Fed)
    url: https://fred.stlouisfed.org/docs/api/fred/
    kind: data
  - label: fredapi — Python client with ALFRED vintages
    url: https://github.com/mortada/fredapi
    kind: repo
  - label: MIT 15.401 — Finance Theory I (Andrew Lo), video lectures and slides
    url: https://ocw.mit.edu/courses/15-401-finance-theory-i-fall-2008/pages/video-lectures-and-slides/
    kind: course
  deliverable: notebooks/day-006-curve-and-fx.ipynb with three dated yield curves on one axis, plus the
    FX glossary entry.
  checkpoint: The 3-month yield is above the 10-year. State what the market is asserting about the path
    of short rates, without using the word recession.
  prep_for_tomorrow:
  - Reread your six glossary entries and mark the ones you could not defend to someone who trades the
    instrument. That marking is tomorrow's task list.
  - Set a 60-second timer on your phone and leave it somewhere you will see it. The drill thread starts
    tomorrow and it runs on a clock.
  - Download the Grinstead and Snell probability PDF once, so it is local for the next year of drills.
- day: 7
  date: '2026-08-13'
  weekday: Thursday
  week: 1
  phase: Markets
  kind: catchup
  title: Six instruments, from memory, on one page
  why: Nothing new today. If days 1 to 6 landed, this hour is yours to spend or to skip; if two of the
    glossary entries are thin, this is where they get fixed.
  objectives:
  - Reproduce all six instrument definitions from memory with no more than one prompt each.
  - Say which two of the six you understand least well, and what specifically is missing.
  tasks:
  - text: Finish anything outstanding from days 1 to 6. The most common gap is the ETF creation-redemption
      sequence, because it is the only one that is a process rather than a definition.
    minutes: 15
  - text: 'Close every file. On one blank page, write the six instruments and for each: what it obliges
      you to do, what it obliges the other side to do, and the one thing that surprised you. Then open
      the glossary and mark what you missed.'
    minutes: 20
  resources:
  - label: Grinstead & Snell — Introduction to Probability (free PDF)
    url: https://math.dartmouth.edu/~prob/prob/prob.pdf
    kind: textbook
  deliverable: The blank-page recall sheet, photographed or retyped into reports/milestone-01-market-map.md,
    with your gaps marked.
  checkpoint: Which of the six instruments has cash flows before expiry that are not optional for either
    side, and why does that matter for how you fund it?
  prep_for_tomorrow:
  - Watch the first ten minutes of the Copenhagen microstructure playlist tonight, only to hear the vocabulary
    once before you meet it properly tomorrow.
  - Clone the finmarkets repository so the slides are local.
  - Look at any broker's order ticket screen and list every order type it offers. Tomorrow you find out
    what each one actually instructs the exchange to do.
  drill:
  - Mental arithmetic baseline, and you will repeat this every drill day for a year, so write the numbers
    down. Ten two-digit multiplications against a 60-second clock, then 1/7 through 6/7 as decimals from
    memory, then 15 percent of 340 and 340 divided by 8. Record the time and the error count.
  - 'Counting, warm-up: how many distinct five-card poker hands contain exactly one pair? Get the number,
    then check it sums correctly against the total of 2,598,960 hands when you add the other categories
    from memory.'
  - 'Conditional probability, the version that gets asked: a family has two children, at least one of
    whom is a boy born on a Tuesday. Probability both are boys? Do it by enumerating the sample space,
    and then say out loud why the Tuesday changes the answer at all.'
- day: 8
  date: '2026-08-14'
  weekday: Friday
  week: 2
  phase: Markets
  kind: study
  title: An order is an instruction, and there are only a few
  why: Every backtest you write for the next eleven months assumes an order type, usually without saying
    so, and today is where you learn what you would be assuming.
  objectives:
  - State exactly what a limit order, a market order, a stop order and a stop-limit order instruct the
    exchange to do, in the exchange's terms rather than the broker's marketing.
  - Say which of those four can execute at a price you did not choose, and which can fail to execute at
    all.
  tasks:
  - text: Watch lectures 1 and 2 of the Copenhagen Financial Markets Microstructure playlist, following
      along in the matching slides from the finmarkets repository. This is the cleanest free treatment
      of the book and the order types.
    minutes: 40
  - text: 'Write the four order types into the glossary as instructions, in the form: if the book looks
      like this, do that. Then add the two failure modes: the limit order that never fills, and the stop
      that fills 3 percent below where you set it.'
    minutes: 15
  resources:
  - label: Financial Markets Microstructure (Copenhagen, Starkov) — video lectures
    url: https://www.youtube.com/playlist?list=PL4pUs4P_j1Wa2_P1lw44kFWWjKDTGUY7S
    kind: video
  - label: Financial Markets Microstructure — slides, homework and exams
    url: https://github.com/electronicgore/finmarkets
    kind: course
  deliverable: Four order-type entries in the glossary, each written as an instruction to a matching engine,
    each with its failure mode.
  checkpoint: You place a market order to buy 10,000 shares of a stock quoted 20.00 bid, 20.02 offered
    with 300 shares showing. What price do you get?
  prep_for_tomorrow:
  - Open the Nasdaq TotalView-ITCH sample directory and note the file sizes. You are not downloading one
    yet; you are calibrating what a day of real order flow weighs.
  - Draw a limit order book on paper from the quotes on any free level-1 feed you can see, five levels
    each side, and leave it beside your desk.
  - Watch lecture 3 of the microstructure playlist tonight if you have twenty minutes; tomorrow starts
    from it.
- day: 9
  date: '2026-08-15'
  weekday: Saturday
  week: 2
  phase: Markets
  kind: study
  title: Price-time priority, and what happens to your order
  why: Queue position is the single most valuable thing a passive order owns, and understanding why is
    what stops you from writing a backtest that fills at the touch every time.
  objectives:
  - Trace a marketable buy order through a book with three price levels and say exactly which resting
    orders it trades against and in what order.
  - Explain why two orders at the same price are not worth the same, and what that is worth in a tick.
  tasks:
  - text: Watch lecture 3 of the Copenhagen microstructure playlist, on the matching mechanism and priority
      rules, with the slides open.
    minutes: 30
  - text: 'Build a toy matching engine in a notebook: a dict of price levels holding a deque of (order_id,
      size) per level, plus add_limit, cancel and execute_market functions honouring price then time.
      Fifty lines. You will reuse it in week 41.'
    minutes: 30
  resources:
  - label: Financial Markets Microstructure (Copenhagen, Starkov) — video lectures
    url: https://www.youtube.com/playlist?list=PL4pUs4P_j1Wa2_P1lw44kFWWjKDTGUY7S
    kind: video
  - label: Financial Markets Microstructure — slides, homework and exams
    url: https://github.com/electronicgore/finmarkets
    kind: course
  deliverable: notebooks/day-009-matching.ipynb with a working price-time-priority book that correctly
    walks a 10,000-share market order through three levels.
  checkpoint: Two orders sit at 20.00, yours behind another for 5,000 shares. What has to happen before
    you trade, and name two ways you never do?
  prep_for_tomorrow:
  - Pull one-minute bars for SPY for the last five trading days from any source you have, and look at
    the volume in the last minute against the rest of the day.
  - Read the one-paragraph description of the Nasdaq closing cross on Nasdaq's own site.
  - Open the Optiver Trading at the Close Kaggle competition page and read the data description only.
    You will use this dataset in phase 7; today it is context.
- day: 10
  date: '2026-08-16'
  weekday: Sunday
  week: 2
  phase: Markets
  kind: study
  title: The close is an auction, and it is the biggest trade of the day
  why: Every strategy you build this year will notionally trade at the close, so it is worth knowing that
    the close is not a trade at all but a single-price auction with its own participants and its own deadlines.
  objectives:
  - Describe how a closing auction sets one price, and say what an imbalance message tells you and when
    it starts being published.
  - Say why a large index fund trades in the auction rather than during the day, and what that does to
    your fill if you join them.
  tasks:
  - text: Watch the Copenhagen microstructure lecture on call auctions and price discovery. The mechanism
      is the same one that opens every equity market in the world.
    minutes: 25
  - text: 'Measure it: from your five days of SPY one-minute bars, compute the share of the day''s volume
      that trades in the final minute, and the same for the opening minute. Do it for one small-cap ticker
      too. Report four numbers.'
    minutes: 25
  - text: Read the data description of the Optiver Trading at the Close competition and write down the
      three fields it gives you that you did not know existed until today.
    minutes: 10
  resources:
  - label: Financial Markets Microstructure (Copenhagen, Starkov) — video lectures
    url: https://www.youtube.com/playlist?list=PL4pUs4P_j1Wa2_P1lw44kFWWjKDTGUY7S
    kind: video
  - label: Kaggle — Optiver, Trading at the Close (Nasdaq closing auction)
    url: https://www.kaggle.com/competitions/optiver-trading-at-the-close
    kind: data
  deliverable: 'Four measured numbers in notebooks/day-010-auctions.ipynb: closing and opening volume
    share for one large-cap ETF and one small-cap name.'
  checkpoint: Why does an index fund rebalancing at the close get a better outcome than the same fund
    working the order from 3 pm?
  prep_for_tomorrow:
  - Find the fee schedule page of any US equity exchange and locate the maker rebate and the taker fee,
    in dollars per hundred shares.
  - Write down what you currently believe a rebate is for. Tomorrow tests it.
  - Pull the quoted spread in cents for SPY, AAPL and a stock trading under 5 dollars, from any snapshot
    you can get.
- day: 11
  date: '2026-08-17'
  weekday: Monday
  week: 2
  phase: Markets
  kind: study
  title: Tick size, lot size, and who pays the rebate
  why: The minimum price increment sets the size of the queue, the size of the queue sets the value of
    passivity, and the fee schedule decides who wants to be passive at all.
  objectives:
  - Say what happens to the depth at the touch when the tick is large relative to the spread, and why.
  - Compute the round-trip cost of a maker-taker versus a taker-maker fill for 1,000 shares, in dollars,
    from a real fee schedule.
  tasks:
  - text: Read the finmarkets slides on tick size and trading costs. Then, from a real exchange fee schedule,
      write down the maker rebate and taker fee per hundred shares.
    minutes: 25
  - text: 'Arithmetic you will use all year: for 1,000 shares of a 50-dollar stock quoted with a 1-cent
      spread, compute the cost of crossing the spread, then add the taker fee, then compute the same trade
      done passively with the rebate. Express both as basis points of notional. The ratio between them
      is the reason execution is a discipline.'
    minutes: 25
  - text: Add the three spreads you pulled last night to the glossary with the tick size next to each,
      and note which of the three is tick-constrained.
    minutes: 10
  resources:
  - label: Financial Markets Microstructure — slides, homework and exams
    url: https://github.com/electronicgore/finmarkets
    kind: course
  - label: Financial Markets Microstructure (Copenhagen, Starkov) — video lectures
    url: https://www.youtube.com/playlist?list=PL4pUs4P_j1Wa2_P1lw44kFWWjKDTGUY7S
    kind: video
  deliverable: 'A four-cell cost table in notebooks/day-011-fees.ipynb: aggressive and passive, in dollars
    and in basis points.'
  checkpoint: A stock is quoted 20.00 bid, 20.01 offered with 40,000 shares on each side. What does that
    tell you about the tick, and what does it tell you about the queue?
  prep_for_tomorrow:
  - Look up the current borrow fee for one hard-to-borrow name on any broker's stock loan page, and one
    for SPY. Write down both numbers.
  - Read your broker's one-page description of what a buy-in is.
  - Note in your notebook what you think happens to a short seller when a stock pays a dividend. Tomorrow
    answers it.
- day: 12
  date: '2026-08-18'
  weekday: Tuesday
  week: 2
  phase: Markets
  kind: study
  title: Shorting is a loan, and the lender can call it
  why: Half the strategies in this year are long-short, and the short leg carries a financing cost, a
    recall risk and a dividend obligation that no price series will ever show you.
  objectives:
  - 'Walk through a short sale in the order the steps happen: locate, borrow, sell, mark, return.'
  - State what you owe when the stock you are short pays a dividend, and what a recall forces you to do
    at the worst possible moment.
  tasks:
  - text: Read the Efficiently Inefficient introduction chapter section on short selling and the limits
      of arbitrage. Pedersen's account of why an arbitrage can be right and still bankrupt you is the
      one to have in your head from now on.
    minutes: 25
  - text: 'Write the short-sale sequence into the glossary with the cash flows attached: what you receive,
      what you pay in borrow, what you owe on the dividend, and what the rebate on your short proceeds
      is worth at current short rates. Use the two borrow numbers you looked up last night.'
    minutes: 20
  - text: 'Compute the drag: a market-neutral strategy holds 100 percent long and 100 percent short. At
      a 40-basis-point general collateral borrow fee, what does the short leg cost per year, in basis
      points of gross exposure? Now redo it at 8 percent for a hard-to-borrow name.'
    minutes: 15
  resources:
  - label: Pedersen — Efficiently Inefficient, free introduction chapter
