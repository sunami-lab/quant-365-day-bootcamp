    minutes: 35
  - text: 'Measure the boundary: time each query computed in SQL against the equivalent pulled into pandas,
      for a full universe over ten years. Report both times and the peak memory. The gap is mostly serialisation,
      and knowing that is what tells you which side of the boundary a computation belongs on.'
