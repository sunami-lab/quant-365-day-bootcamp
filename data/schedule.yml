      and short the bottom decile each day, and a time-series version that goes long or short each name
      against its own history. Run both through the engine and report Sharpe, market beta and gross exposure
      for each.'
    minutes: 35
  - text: 'Say what the difference is: the cross-sectional version is dollar neutral by construction and
      its return comes from relative ordering, while the time-series version takes a net market position
      whose size varies. Then check whether the time-series version''s Sharpe survives once you neutralise
      its market exposure.'
    minutes: 25
  resources:
  - label: Asness, Moskowitz & Pedersen (2013) — Value and Momentum Everywhere
