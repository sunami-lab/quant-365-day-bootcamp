  drill:
  - Arithmetic, timed, twentieth sitting. Ten two-digit multiplications, the sevenths, and 1/7 through
    1/13 to three decimals.
  - 'Random walk maximum: a symmetric random walk runs for 100 steps. What is the expected maximum? Use
    the reflection principle to get the distribution of the maximum first, and say the argument out loud
    rather than writing it.'
  - 'Arcsine law, stated as an interview question: over a long fair coin-flipping game, what is the most
    likely fraction of time spent ahead? Most people say one half. Say the right answer and the shape
    of the distribution.'
- day: 141
  date: '2026-12-25'
