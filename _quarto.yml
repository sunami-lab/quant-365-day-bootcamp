project:
    type: website
    output-dir: _site
    render:
        - "*.qmd"
        - "days/*.qmd"
        - "!README.md"

website:
    title: "365-Day Quant Bootcamp"
    description: "A day-by-day year taking a statistician with no finance background to hireable as a buy-side quantitative researcher."
    open-graph: true
    search:
        location: navbar
        type: overlay
    navbar:
        title: "365-Day Quant Bootcamp"
        left:
            - text: "The year"
              href: timeline.qmd
            - text: "Milestones"
              href: milestones.qmd
            - text: "The strategy"
              href: project.qmd
            - text: "Drills"
              href: drills.qmd
            - text: "Hiring"
              href: hiring.qmd
            - text: "Resources"
              href: resources.qmd
            - text: "Setup"
              href: setup.qmd
            - text: "Self-check"
              href: assessment.qmd
        right:
            - icon: github
              href: https://github.com/sunami-lab/quant-365-day-bootcamp
              aria-label: GitHub repository
    page-footer:
        left: "7 August 2026 – 6 August 2027"
        right: "Progress is stored in this browser only."

format:
    html:
        theme:
            light: cosmo
            dark: darkly
        toc: true
        toc-depth: 2
        anchor-sections: true
        link-external-newwindow: true
        css:
            - styles.css
        include-after-body:
            - _includes/site-js.html
