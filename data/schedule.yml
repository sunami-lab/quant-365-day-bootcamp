      which is the empirical core.'
    minutes: 35
  - text: 'Separate the activities: passive market making, latency arbitrage between correlated instruments,
      and short-horizon statistical prediction on order flow. For each, say what it earns, what technology
      it requires and what it risks. Only the third has anything in common with what you do.'
    minutes: 25
  resources:
  - label: Budish, Cramton & Shim (2015) — The High-Frequency Trading Arms Race
