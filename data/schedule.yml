- day: 303
  date: '2027-06-05'
  weekday: Saturday
  week: 44
  phase: Microstructure
  kind: study
  title: Which strategy dies first as the money grows
  why: Capacity is not a single number per strategy but a curve, and the ordering of those curves decides
    what a larger version of your book would even contain.
  objectives:
  - Rank your strategies by how fast their net performance decays with size, and explain the ordering
    from turnover and universe liquidity.
  - Say what the book would look like at ten and at a hundred times your current size.
  tasks:
  - text: 'Explain the ordering rather than just reporting it: decay speed is driven by turnover and by
      the liquidity of the names the signal concentrates in, so a fast signal in small caps dies first
      and a slow signal in large caps last. Check that prediction against your curves and note any strategy
      that does not fit it.'
    minutes: 30
  - text: 'Construct the larger books: re-optimise the combination at ten and a hundred times current
      size, letting the weights respond to the size-dependent costs. The composition changes, and the
      way it changes is the most interesting result of the day.'
    minutes: 25
  - text: Write the one-paragraph answer to which strategy dies first and why, which milestone 9 requires.
    minutes: 10
  resources:
  - label: Tóth et al. (2011) — Anomalous price impact and the critical nature of liquidity
    url: https://arxiv.org/abs/1105.1694
    kind: paper
  - label: AQR — Research and Insights
    url: https://www.aqr.com/Insights/Research
    kind: reference
  deliverable: Net performance curves against size for every signal, and re-optimised book compositions
    at two larger sizes.
  checkpoint: Which of your strategies dies first as size grows, and why was that predictable from its
    turnover?
  prep_for_tomorrow:
  - 'Write down your best guess at four latency numbers: an L1 cache reference, a main memory reference,
    a random SSD read, and a round trip across a data centre.'
  - 'Then a fifth: the round trip from Chicago to New York on the fastest available route.'
  - Tomorrow you check all five.
  project: The book is re-optimised at ten and a hundred times current size with size-dependent costs,
    showing how the composition changes as capacity binds rather than only how performance falls.
- day: 304
  date: '2027-06-06'
  weekday: Sunday
  week: 44
  phase: Microstructure
  kind: study
  title: The latency hierarchy, in numbers rather than adjectives
  why: Fast is not a property, it is a set of specific durations, and knowing them separates a sensible
    statement about what you can and cannot do from a vague one.
  objectives:
  - State the latency of a cache reference, a memory reference, an SSD read, a data centre round trip
    and a Chicago to New York round trip, to an order of magnitude.
  - Say which of your own operations are bounded by which of those, measured rather than guessed.
  tasks:
  - text: 'Check your five guesses and fix the wrong ones, then add three more: a network round trip within
      a rack, a Python function call, and a numpy operation on a thousand-element array. Write all eight
      on one card with the units aligned so the ratios are visible.'
    minutes: 25
  - text: 'Measure your own stack: time your signal computation, your order submission round trip to the
      paper broker, and your data pull. Then place them on the same scale as the eight reference numbers.
      Your submission round trip is probably five orders of magnitude above the exchange''s matching time,
      and knowing that number precisely is what makes tomorrow''s argument concrete.'
    minutes: 35
  resources:
  - label: Jane Street — tech blog
    url: https://blog.janestreet.com/
    kind: reference
  - label: Budish, Cramton & Shim (2015) — The High-Frequency Trading Arms Race
    url: https://www.cramton.umd.edu/papers2015-2019/budish-cramton-shim-hft-frequent-batch-auctions.pdf
    kind: paper
  deliverable: An eight-entry latency card with your own measured stack latencies placed on the same scale.
  checkpoint: Roughly how long does an L1 cache reference take, a main memory reference, a random SSD
    read and a data centre round trip? Now say why that changes how you would store a tick database.
  prep_for_tomorrow:
  - Read the abstract and introduction of the Budish, Cramton and Shim paper on the high-frequency arms
    race.
  - Write down the specific inefficiency they identify. It is a mechanism design point rather than a complaint.
  - Two sentences.
- day: 305
  date: '2027-06-07'
  weekday: Monday
  week: 44
  phase: Microstructure
  kind: study
  title: What high-frequency firms actually do, stated precisely
  why: The vocabulary is loose and the activities are distinct, and being able to name three separate
    businesses that all get called high-frequency trading is a question that gets asked.
  objectives:
  - Name three distinct high-frequency activities and say what each earns and what each risks.
  - State the specific inefficiency the arms race paper identifies and the mechanism it proposes.
  tasks:
