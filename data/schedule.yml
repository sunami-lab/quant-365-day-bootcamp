      market maker who breaks even, the ask is the expected value given a buy and the bid is the expected
      value given a sell. Both are Bayesian updates, which is a calculation you can do in your sleep,
      and the whole model is those two updates.'
    minutes: 30
  - text: 'Explore the mechanism: plot the spread against the informed fraction and show it diverges as
      that fraction approaches one, which is a market that closes. Then simulate the sequential trading
      and show the price converging to the true value, which is the model''s other result and the reason
      it is called price discovery.'
    minutes: 30
