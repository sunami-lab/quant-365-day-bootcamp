- day: 235
  date: '2027-03-29'
  weekday: Monday
  week: 34
  phase: Machine learning
  kind: study
  title: The model that wins gross and loses net
  why: A more flexible model produces a less stable forecast, which produces more turnover, which costs
    money, and that chain is where most machine learning advantages in this field disappear.
  objectives:
  - Report gross and net performance for every model and the turnover that separates them.
  - Say what constraint you would add to make the flexible model competitive net, and test it.
  tasks:
  - text: 'Report the full picture: for every model, gross information ratio, turnover, net information
      ratio, and the net-Sharpe-against-cost curve on one axis. The flexible models will have higher turnover
      and the ordering may reverse between the gross and net columns.'
    minutes: 30
  - text: 'Test one fix rather than several: add a turnover penalty to the portfolio construction, tuned
      on the validation period rather than the test period, and rerun. Report whether it closes the gap.
      Note that this is one more specification and log it, since the audit''s trial count now includes
      it.'
    minutes: 25
  - text: Compute the capacity of the winning model's portfolio using the same method as day 173, so the
      comparison against the alpha book is like for like.
    minutes: 10
  resources:
  - label: Tóth et al. (2011) — Anomalous price impact and the critical nature of liquidity
    url: https://arxiv.org/abs/1105.1694
