  title: A continuous futures series is something you construct
  why: There is no such thing as a ten-year price history for a contract that expires quarterly, so every
    futures backtest starts with a construction choice that changes the answer.
  objectives:
  - Name three ways to splice a continuous series and say what each does to the return series and to the
    price level.
  - Show that a naive price-splice creates returns that nobody could have earned.
  tasks:
  - text: 'Build all three from whatever contract data or ETF proxies you have: an unadjusted price splice,
      a back-adjusted series where the gap at each roll is subtracted from history, and a ratio-adjusted
      series. Plot the three and note that the back-adjusted one can go negative far enough back, which
      is a real property and not a bug.'
    minutes: 30
  - text: 'Show the error: compute the return series from the naive splice and find the fictitious return
      on each roll date, then report the annualised size of that artifact. This is the single most common
      futures backtest mistake and it can be worth several percent a year.'
    minutes: 20
  - text: 'Fix the convention in qlib: returns come from within-contract price changes, never across a
      roll, and the continuous series exists only for display. Write it as a docstring rule and a test.'
    minutes: 10
