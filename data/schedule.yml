  - 'Expected value under a budget: you may pay to roll a die up to three times, keeping the last roll.
    What is the game worth, and what are the two thresholds in the optimal policy? State both numbers.'
- day: 155
  date: '2027-01-08'
  weekday: Friday
  week: 23
  phase: The research harness
  kind: study
  title: Poison the future and assert nothing changes
  why: This is the test that turns a claim about your engine into a fact about it, and it is the one an
    interviewer will ask you to describe.
  objectives:
  - Implement a test that corrupts all data after the decision timestamp and asserts every backtest output
    is bit-identical.
  - Say what the test would fail to catch, and write a second test for that gap.
  tasks:
  - text: 'Write tests/test_no_lookahead.py: run a strategy over a fixed window, then rerun it with every
      value after each decision timestamp replaced by noise, and assert the fills, positions and returns
      are identical. Run it against all your strategies. If any of them fails, the failure is the most
      valuable result of the week.'
    minutes: 35
  - text: 'Find the gap: the poisoning test catches a strategy reading forward data, but it does not catch
      a parameter that was chosen by looking at the whole sample, because that choice happened outside
      the engine. Write the second test as an assertion that the configuration hash used in a run matches
      one recorded before the evaluation window began.'
    minutes: 25
  resources:
  - label: pytest documentation
    url: https://docs.pytest.org/en/stable/
    kind: tool
  - label: López de Prado — Advances in Financial Machine Learning, seminar slides
    url: https://www.quantresearch.org/Lectures.htm
    kind: reference
  deliverable: tests/test_no_lookahead.py passing for every strategy, plus a second test on configuration
    provenance.
  checkpoint: Describe the poisoned-future test, then say precisely what class of look-ahead it cannot
    detect.
  prep_for_tomorrow:
  - Design a synthetic price series where you know the exactly correct strategy return in closed form.
  - A deterministic sawtooth with a known amplitude and period is the easiest one.
  - Write down the analytic answer before you code anything.
- day: 156
  date: '2027-01-09'
  weekday: Saturday
  week: 23
  phase: The research harness
  kind: study
  title: Synthetic data whose right answer you already know
  why: Testing an engine against real data can only tell you it produces a number; testing it against
    a case with a closed-form answer tells you the number is right.
  objectives:
  - Construct at least two synthetic cases with analytically known strategy returns and assert the engine
    reproduces them.
  - Say what each case tests that the other does not.
  tasks:
  - text: 'Build three cases in tests/: a constant-drift series where a fully invested strategy''s return
      is exact, a deterministic sawtooth where a perfect mean-reversion rule''s gross return is exact,
      and a case with a known cost so the net return is exact. Assert each to tight tolerance.'
    minutes: 35
  - text: 'Make the cost case sharp: with a known turnover and a fixed cost per trade, the annual cost
      is arithmetic, so assert the engine''s reported cost against the hand computation. This catches
      double-counting of the spread, which is the most common cost bug and one that flatters the strategy.'
    minutes: 25
  resources:
  - label: pytest documentation
    url: https://docs.pytest.org/en/stable/
    kind: tool
  - label: backtesting.py — small readable event-driven backtester
    url: https://kernc.github.io/backtesting.py/
    kind: tool
  deliverable: Three synthetic test cases with analytic answers, all passing to a stated tolerance.
  checkpoint: Which of your synthetic tests would catch a spread charged twice, and how tight is the tolerance
    you set?
  prep_for_tomorrow:
  - Generate 200 random position series with the same turnover as your pairs strategy but no relationship
    to returns.
  - Run them through the engine and save the Sharpe of each.
  - Do not look at the distribution yet.
- day: 157
  date: '2027-01-10'
  weekday: Sunday
  week: 23
  phase: The research harness
  kind: study
  title: The null strategy test, and what your engine says about nothing
  why: An engine with a subtle bias will give a random strategy a nonzero expected return, and running
    200 of them is the cheapest way to find out whether yours does.
  objectives:
  - Report the mean and distribution of Sharpe for random strategies through your engine, and state what
    it should be.
  - Say what a nonzero mean would imply about the engine rather than about the strategies.
  tasks:
  - text: 'Analyse last night''s 200 null runs: report the mean Sharpe with a standard error and test
      whether it differs from the small negative value that costs alone should produce. A mean above zero
      after costs means the engine has a bias, and the usual culprits are fill timing and the treatment
      of the first and last session.'
    minutes: 30
  - text: 'Turn it into a permanent test: assert the mean null Sharpe lies within an interval around the
      cost-implied value, with enough replications that the test is powered to catch a bias of the size
      that would matter. Record the runtime, since a slow test is one you will disable.'
    minutes: 25
  - text: 'Characterise the distribution too, since you will use it as the reference null for phase 6:
      report its standard deviation and the 95th percentile.'
    minutes: 10
  resources:
  - label: pytest documentation
    url: https://docs.pytest.org/en/stable/
    kind: tool
  - label: Bailey, Borwein, López de Prado & Zhu (2017) — The Probability of Backtest Overfitting
    url: https://escholarship.org/content/qt4w1110bb/qt4w1110bb.pdf
    kind: paper
  deliverable: A null-strategy test in the suite with the distribution characterised, and the mean tested
    against the cost-implied value.
  checkpoint: Your 200 null strategies have a mean Sharpe of plus 0.15 after costs. What is wrong, and
    where would you look first?
  prep_for_tomorrow:
  - List the invariants your engine should satisfy for any strategy and any data. There are at least five.
  - The accounting identity is one. Non-negative absolute positions under a long-only constraint is another.
  - Write them as assertions, not as sentences.
  project: The null-strategy distribution is now a characterised property of the engine and a standing
    test. Phase 6 evaluates every signal against this distribution rather than against zero.
- day: 158
  date: '2027-01-11'
  weekday: Monday
  week: 23
  phase: The research harness
  kind: study
  title: Invariants that must hold for every strategy and every input
