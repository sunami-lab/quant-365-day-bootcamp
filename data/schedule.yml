- day: 309
  date: '2027-06-11'
  weekday: Friday
  week: 45
  phase: Production
  kind: study
  title: The SQL you keep rewriting in pandas, written once
  why: Half the transformations in your notebooks are window functions, and writing them where the data
    lives is faster, shorter and the version an interviewer will ask you to produce.
  objectives:
  - Write a rolling aggregate per symbol as a window function and explain the frame clause.
