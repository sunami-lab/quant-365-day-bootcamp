      pure-noise experiment and confirming the cross-validated R-squared returns to zero.'
    minutes: 35
  - text: 'Set the embargo from the data: measure the autocorrelation of your labels and of your features,
      and choose the embargo as the lag at which both have decayed. Report the number and the measurement
      behind it. An embargo picked by convention is a parameter you cannot defend in an interview.'
