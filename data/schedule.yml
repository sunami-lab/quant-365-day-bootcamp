    has a cost you can quantify.
  tasks:
  - text: 'Test formally rather than by eye: for each coefficient, compare the across-era variance against
      the within-era standard errors. If the first exceeds the second, the relationship is genuinely moving
      and a single fitted model is estimating an average of different things.'
    minutes: 30
  - text: 'Quantify the window trade-off: fit the model on rolling windows from 1 to 10 years and plot
      the out-of-sample R-squared against window length. A short window adapts and has more estimation
      error; a long window is stable and stale. The maximum of that curve is your answer and it is a measurement
      rather than a preference.'
    minutes: 30
