  prep_for_tomorrow:
  - Write down the one test that would prove your engine cannot see the future, in the form of an experiment
    rather than an inspection.
  - 'The shape is: change something the engine should not be able to see, and assert the output does not
    move.'
  - Three lines of pseudocode.
  drill:
  - Arithmetic, timed, twenty-second sitting. Ten two-digit multiplications, the sevenths, and 250 divided
