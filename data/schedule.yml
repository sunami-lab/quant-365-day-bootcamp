- day: 330
  date: '2027-07-02'
  weekday: Friday
  week: 48
  phase: The interview
  kind: study
  title: Your own error log is the syllabus
  why: Forty-seven drill sittings produced a record of exactly which problems you are slow on, which is
    a better study plan than any book's table of contents.
  objectives:
  - Classify every problem you have got wrong or been slow on into categories, and rank the categories
    by count.
  - State the two categories that account for most of your errors and plan this week around them.
  tasks:
  - text: 'Build the classification: go through the file from last night and tag each problem by type,
      such as conditional probability, expectation by conditioning, symmetry, martingale, random walk,
      order statistics, combinatorics, or arithmetic. Count by tag and sort.'
    minutes: 30
  - text: 'Look for the pattern behind the counts rather than only the counts: errors usually cluster
      around a technique you avoid rather than a topic you do not know. Write one sentence on what the
      top category has in common, then design the six sessions of this week around it, weighting the two
      largest categories most heavily.'
    minutes: 25
  - text: 'Set the measurement: your timed mixed-set score from the last eight sittings is the baseline,
      and the target for the end of week 51 is a specific number you write down today.'
    minutes: 10
  resources:
  - label: Jane Street — puzzle archive with solutions
    url: https://www.janestreet.com/puzzles/archive/index.html
    kind: problems
  - label: Grinstead & Snell — Introduction to Probability (free PDF)
    url: https://math.dartmouth.edu/~prob/prob/prob.pdf
    kind: textbook
  deliverable: A tagged and counted error log with the top two categories identified and this week's six
    sessions planned around them.
  checkpoint: What are your two weakest problem categories, and what do they have in common?
  prep_for_tomorrow:
  - Pick eight conditional probability problems from your error log and from the Jane Street archive,
    and put them in a file unsolved.
  - Do not look at any of them tonight.
  - Set a timer ready for tomorrow. Everything from here runs on a clock.
- day: 331
  date: '2027-07-03'
  weekday: Saturday
  week: 48
  phase: The interview
  kind: study
  title: Conditional probability, eight problems, forty minutes
  why: The canon is small and the failure is speed rather than knowledge, so from here the sessions are
    timed and the score is the deliverable.
  objectives:
  - Solve eight conditional probability problems under a clock and score yourself honestly.
  - For every problem you missed, name the technique you failed to reach for rather than the answer you
    got wrong.
  tasks:
  - text: Forty minutes, eight problems, five minutes each, no notes, out loud where you can. Stop at
      the time limit whether or not you are finished, because running over is the habit that costs you
      in a real interview.
    minutes: 40
  - text: 'Review only the misses, and write the technique rather than the solution: natural frequencies
      instead of Bayes, conditioning on the first step, complementary counting, or drawing the sample
      space. The technique list is short and it is what transfers.'
    minutes: 20
  resources:
  - label: Jane Street — puzzle archive with solutions
    url: https://www.janestreet.com/puzzles/archive/index.html
    kind: problems
  - label: Harvard Stat 110 — Probability (Blitzstein), lecture videos
    url: https://www.youtube.com/playlist?list=PL2SOU6wwxB0uwwH80KTQ6ht66KWxbzTIo
    kind: video
  deliverable: A scored eight-problem session with a technique named for every miss.
  checkpoint: You are told at least one of two children is a boy. Probability both are boys, and why is
    the answer not one half?
  prep_for_tomorrow:
  - Choose eight expectation problems, weighted toward the ones your error log says you are slow on.
  - Include at least two that yield to indicator variables and two that need conditioning.
  - File them unsolved.
- day: 332
  date: '2027-07-04'
  weekday: Sunday
  week: 48
  phase: The interview
  kind: study
  title: Expectation by indicators, symmetry and conditioning
  why: Three techniques cover most expectation problems asked in interviews, and recognising which one
    applies in the first fifteen seconds is what separates a two-minute answer from a ten-minute one.
  objectives:
  - Solve eight expectation problems under a clock, and for each name the technique before starting.
  - State the recognition rule for each of the three techniques.
  tasks:
  - text: Forty minutes, eight problems. Before starting each one, write down which technique you are
      going to use. Getting the technique right and the arithmetic wrong is a much better outcome than
      the reverse, and tracking the two separately tells you which to practise.
    minutes: 40
  - text: 'Write the three recognition rules: indicators when the quantity is a count of events, conditioning
      when the process has a natural first step, and symmetry when relabelling the objects leaves the
      problem unchanged. Then test the rules against the eight problems you just did.'
    minutes: 20
  resources:
  - label: Grinstead & Snell — Introduction to Probability (free PDF)
    url: https://math.dartmouth.edu/~prob/prob/prob.pdf
    kind: textbook
  - label: Jane Street — puzzles
    url: https://www.janestreet.com/puzzles/
    kind: problems
  deliverable: A scored session with the technique predicted before each problem, and three written recognition
    rules.
  checkpoint: You draw cards until you see an ace. Expected number of draws? Do it by symmetry in under
    a minute.
  prep_for_tomorrow:
  - Choose six martingale and optional stopping problems, including at least one with a drift.
  - Write down the three conditions of the optional stopping theorem from memory tonight.
  - You will need them tomorrow to say why a particular strategy fails.
- day: 333
  date: '2027-07-05'
  weekday: Monday
  week: 48
  phase: The interview
  kind: study
  title: Martingales, and the stopping theorem's fine print
  why: The technique that turns a hard calculation into a one-line answer, and the one where the conditions
    matter because the classic doubling strategy violates exactly one of them.
  objectives:
  - Solve six martingale problems under a clock, identifying the martingale before computing anything.
  - State the optional stopping conditions and say which one a doubling strategy violates.
  tasks:
  - text: Forty minutes, six problems. The hard part is finding the martingale, so for each one write
      down the candidate before proceeding. For a biased walk the martingale is an exponential of the
      position, and recognising that once is worth more than solving three problems.
    minutes: 40
  - text: 'Work the doubling strategy carefully: it appears to guarantee a profit, and it fails because
      the stopping time is not bounded and the wealth is not, which is a violation of the boundedness
      condition. Say it out loud in the form an interviewer wants, which names the condition and then
      names the real-world thing that enforces it.'
    minutes: 20
  resources:
  - label: 'Durrett — Probability: Theory and Examples (author''s free 5th ed. draft)'
    url: https://services.math.duke.edu/~rtd/PTE/PTE5_011119.pdf
    kind: textbook
  - label: Grinstead & Snell — Introduction to Probability (free PDF)
    url: https://math.dartmouth.edu/~prob/prob/prob.pdf
    kind: textbook
  deliverable: A scored six-problem session with the martingale identified in writing before each solution.
  checkpoint: Doubling after every loss appears to guarantee a profit. Name the optional stopping condition
    it violates and what enforces that condition in reality.
  prep_for_tomorrow:
  - 'Choose six random walk problems: ruin probabilities, expected durations, first passage, and the reflection
    principle.'
  - Include one about the maximum of the walk.
  - File them unsolved.
- day: 334
  date: '2027-07-06'
  weekday: Tuesday
  week: 48
  phase: The interview
  kind: study
  title: Random walks, ruin and first passage, under a clock
  why: The most heavily asked family in trading interviews because a random walk is the simplest model
    of a price, and the questions test whether you can set up a difference equation quickly.
  objectives:
  - Solve six random walk problems under a clock, setting up the recursion within the first minute.
  - State the reflection principle and use it to get the distribution of the maximum.
  tasks:
  - text: Forty minutes, six problems. For each, the setup is a difference equation with boundary conditions,
      and the discipline is to write it down before attempting to solve. Most failures here are setup
      failures rather than algebra failures.
    minutes: 40
  - text: 'Do the reflection principle properly once: every path that exceeds a level and ends below it
      maps to a path that ends above the reflected level, which gives the distribution of the maximum
      in one line. Then use it for the expected maximum over n steps and check numerically.'
    minutes: 20
  resources:
  - label: Grinstead & Snell — Introduction to Probability (free PDF)
    url: https://math.dartmouth.edu/~prob/prob/prob.pdf
    kind: textbook
  - label: Jane Street — puzzle archive with solutions
    url: https://www.janestreet.com/puzzles/archive/index.html
    kind: problems
  deliverable: A scored six-problem session, plus the reflection principle applied to the distribution
    of the maximum and checked numerically.
  checkpoint: A symmetric random walk starts at 0. Give the probability it reaches plus 10 before minus
    5, and the expected time to stop.
  prep_for_tomorrow:
  - Choose six order statistics and extreme value problems.
  - Include the interview classic about hiring the best candidate and one about the expected range of
    n uniforms.
  - File them unsolved.
- day: 335
  date: '2027-07-07'
  weekday: Wednesday
  week: 48
  phase: The interview
  kind: study
  title: Order statistics, extremes, and the winner's curse
  why: The last family of the week and the one with the most direct trading content, because the extreme
    of many draws is exactly what you are trading against when your order is the one that gets filled.
  objectives:
  - Solve six order statistics problems under a clock.
  - State the winner's curse in trading terms and connect it to two things you measured earlier in the
    year.
  tasks:
  - text: Forty minutes, six problems. The general result for the expectation of the kth of n uniforms
      is worth having memorised because it makes several of these immediate, and everything else transforms
      to the uniform case.
    minutes: 40
  - text: 'Connect it to your own work: the best of many backtests from day 51 and the best of many quotes
      from day 119 are the same calculation. Write the connection in the form you would use in an interview,
      which is one sentence naming both and one saying what the correction is.'
    minutes: 20
  resources:
  - label: Grinstead & Snell — Introduction to Probability (free PDF)
    url: https://math.dartmouth.edu/~prob/prob/prob.pdf
    kind: textbook
  - label: Jane Street — puzzles
    url: https://www.janestreet.com/puzzles/
    kind: problems
  deliverable: A scored six-problem session, plus the written connection between the winner's curse, backtest
    selection and quote selection.
  checkpoint: Twenty dealers quote you a price and you trade on the best one. What have you learned about
    that price?
  prep_for_tomorrow:
  - Update your error log with everything from this week.
  - Check whether the category ranking has changed since day 330.
  - Check your timed mixed-set scores; tomorrow is the ninth sitting.
- day: 336
  date: '2027-07-08'
  weekday: Thursday
  week: 48
  phase: The interview
  kind: catchup
  title: The canon, mixed and timed
  why: Light day. Five sessions of one family each is easier than a mixed set, because in a real interview
    nobody tells you which technique applies.
  objectives:
  - Score a mixed set drawn from all five families without knowing which is which.
  - Report whether your weakest category from day 330 has moved.
  tasks:
  - text: 'Finish anything outstanding from days 330 to 335, then run a mixed set: ten problems, thirty
      minutes, drawn from all five families in random order. The recognition step is what is being tested
      and it is the step the single-family sessions did not train.'
    minutes: 35
  - text: Update the error log and compare the category ranking against day 330. A category that has not
      moved after a week of work needs a different approach rather than more repetitions.
    minutes: 15
  resources:
  - label: Jane Street — puzzle archive with solutions
    url: https://www.janestreet.com/puzzles/archive/index.html
    kind: problems
  - label: Grinstead & Snell — Introduction to Probability (free PDF)
    url: https://math.dartmouth.edu/~prob/prob/prob.pdf
    kind: textbook
  deliverable: A scored ten-problem mixed set and an updated error log with the category ranking compared
    against day 330.
  checkpoint: Which of your five families is still slowest, and what is different about how you are practising
    it now?
  prep_for_tomorrow:
  - Write down what you think a market maker is optimising when they choose a quote width.
  - Then write what they are optimising when they choose which side to skew.
  - Two different objectives, and tomorrow makes both precise.
  drill:
  - 'Timed mixed set, ninth sitting: five problems in fifteen minutes, and this one is on top of today''s
    thirty-minute set, so you are working tired. That is deliberate; the fourth interview of a superday
    is also tired.'
  - 'Market making, fifth sitting: I quote you a market on a quantity with a known distribution, and you
    may trade any size up to a limit. How much do you trade, and how does size depend on your edge? The
    size answer is Kelly and you have already done that arithmetic on day 128.'
  - 'Estimation: how many people are airborne over the United States right now? Reason to it, then say
    which of your assumptions the answer is most sensitive to.'
- day: 337
  date: '2027-07-09'
  weekday: Friday
  week: 49
  phase: The interview
  kind: study
  title: A quote is a decision under two kinds of uncertainty
  why: Trading games are the round where academics do worst, and the reason is that they are treated as
    puzzles rather than as decisions with an explicit objective.
  objectives:
  - State what a quote width is trading off and what a skew is expressing, in one sentence each.
  - Quote and requote on three exercises, saying the reasoning out loud each time.
  tasks:
  - text: 'Write the two objectives precisely: width trades the probability of trading against the expected
      loss to someone better informed, and skew expresses your inventory and your view about the fair
      value. Then note the third thing a width does, which is to protect against your own estimate being
      wrong, and which is the one candidates forget.'
    minutes: 25
  - text: Practise three exercises out loud, quoting a two-sided market on a quantity, being traded with,
      and requoting. Say the reasoning at each step. Recording yourself once is worth more than doing
      six silently, because the assessment in a real interview is of the reasoning rather than of the
      number.
    minutes: 35
  resources:
  - label: Financial Markets Microstructure (Copenhagen, Starkov) — video lectures
    url: https://www.youtube.com/playlist?list=PL4pUs4P_j1Wa2_P1lw44kFWWjKDTGUY7S
    kind: video
  - label: Jane Street — puzzles
    url: https://www.janestreet.com/puzzles/
    kind: problems
  deliverable: The two objectives written precisely, plus a recording of three quote-and-requote exercises
    with reasoning spoken.
  checkpoint: I lift your offer twice in a row. What do you do to your quote, and what are you assuming
    when you do it?
  prep_for_tomorrow:
  - Clone the IMC Prosperity backtester and get it running on one of the included rounds.
  - Do not write a strategy yet; just get the harness working.
  - Twenty minutes maximum.
- day: 338
  date: '2027-07-10'
  weekday: Saturday
  week: 49
  phase: The interview
  kind: study
  title: A trading game with real rounds and a scoreboard
  why: Reasoning about quoting is not the same as quoting under time pressure against an adversary, and
    a simulator with real competition data is the closest free substitute for the real round.
  objectives:
  - Run a market-making strategy in the Prosperity backtester and report its profit and its inventory
    profile.
  - Say which of your losses came from adverse selection and which from inventory risk.
  tasks:
  - text: 'Write a simple market maker for one product: quote symmetrically around a fair value estimate,
      skew against inventory, and widen when recent flow has been one-sided. That is your day 25 simulation
      with a real counterparty, and the parameters you chose there are the ones to start from.'
    minutes: 35
  - text: 'Attribute the outcome rather than only reporting it: split profit into spread captured, inventory
      profit and loss, and adverse selection measured as the mid drift after your fills. The attribution
      is the useful output and it is exactly the day 284 decomposition applied to your own quotes.'
    minutes: 25
  resources:
  - label: IMC Prosperity 3 backtester with real round data
    url: https://github.com/jmerle/imc-prosperity-3-backtester
    kind: repo
  - label: Optiver Ready Trader Go — surviving simulator mirror
    url: https://github.com/keanekwa/Optiver-Ready-Trader-Go
    kind: repo
  deliverable: A market-making strategy running in the backtester with profit attributed across spread,
    inventory and adverse selection.
  checkpoint: Your market maker lost money. Was it adverse selection or inventory, and what number told
    you?
  prep_for_tomorrow:
  - 'Take yesterday''s strategy and add one rule: update your fair value estimate based on which side
    traded.'
  - Run it and compare against the version without the rule.
  - Two profit numbers.
- day: 339
  date: '2027-07-11'
  weekday: Sunday
  week: 49
  phase: The interview
  kind: study
  title: The fact that they traded is information
  why: The difference you measured last night is Glosten-Milgrom appearing in your own strategy, and being
    able to state that connection is a strong answer in a trading interview.
  objectives:
  - Implement a fair-value update conditional on trade direction and report its effect on profit.
  - State the update as a Bayesian one and say what its strength should depend on.
  tasks:
  - text: 'Formalise the rule: the size of the fair value update given a trade is a Bayesian posterior
      shift, and it should be larger when the fraction of informed flow is higher and when the trade was
      large relative to displayed size. Implement both dependencies and measure each separately.'
    minutes: 35
  - text: 'Find the failure mode: an update rule that is too strong lets an adversary walk your quote
      by trading repeatedly in one direction with no information at all. Test that attack against your
      own strategy and report how much it costs you, then tune the update strength to a level that survives
      it.'
    minutes: 25
  resources:
  - label: Glosten & Milgrom (1983 working paper) — Bid, Ask and Transaction Prices in a Specialist Market
    url: https://www.kellogg.northwestern.edu/research/math/papers/570.pdf
    kind: paper
  - label: IMC Prosperity 3 backtester with real round data
    url: https://github.com/jmerle/imc-prosperity-3-backtester
    kind: repo
  deliverable: A Bayesian fair-value update with two dependencies measured, and the walk-the-quote attack
    tested against it.
  checkpoint: How much should your fair value move when someone lifts your offer, and what does that depend
    on?
  prep_for_tomorrow:
  - Write down five expected value questions you would expect in a trading round, each answerable in under
    two minutes.
  - Include at least one where the answer is that you should not play.
  - Tomorrow you answer them against a clock.
- day: 340
  date: '2027-07-12'
  weekday: Monday
  week: 49
  phase: The interview
  kind: study
  title: Expected value under time pressure, and when not to play
  why: Trading rounds test whether you compute an expectation quickly and whether you notice when the
    expectation is negative, and the second failure is the one that ends interviews.
  objectives:
  - Answer eight expected value questions in twenty minutes, including at least one you should decline.
  - 'State the two-part answer format: the number, and the assumption it rests on.'
  tasks:
  - text: 'Twenty minutes, eight questions, out loud. Use the two-part format every time: the expected
      value, then the one assumption that would change it. Interviewers ask about the assumption, so volunteering
      it saves a round trip and shows you know where the answer is fragile.'
    minutes: 30
  - text: 'Then the harder skill: for each question, say what you would pay and what you would sell at,
      which is a width around the expectation rather than the expectation itself. That conversion from
      an estimate to a two-sided market is the actual job and it is what the round is testing.'
    minutes: 30
  resources:
  - label: Jane Street — puzzles
    url: https://www.janestreet.com/puzzles/
    kind: problems
  - label: Jane Street — puzzle archive with solutions
    url: https://www.janestreet.com/puzzles/archive/index.html
    kind: problems
  deliverable: Eight timed expected value answers in the two-part format, each converted into a two-sided
    market.
  checkpoint: I offer you a game with an expected value of plus two dollars and a variance of a thousand.
    Do you play, and how much?
  prep_for_tomorrow:
  - Look back at your arithmetic drill times from days 7 through 329.
  - Plot all of them. There should be a clear trend and then a plateau.
  - Note where the plateau started.
- day: 341
  date: '2027-07-13'
  weekday: Tuesday
  week: 49
  phase: The interview
  kind: study
  title: Arithmetic at speed, trained rather than practised
  why: The plateau you found last night is what happens when you repeat a drill without changing it, and
    breaking a plateau requires a different exercise rather than more repetitions.
  objectives:
  - Identify which specific arithmetic operations are slowest and drill those rather than the whole set.
  - Improve the timed score on your slowest operation by a measurable amount.
  tasks:
  - text: 'Diagnose rather than repeat: time each operation type separately, which is two-digit multiplication,
      percentage of a number, fraction to decimal, division, and compounding. One of them is far slower
      than the others and that is where the whole time goes.'
    minutes: 20
  - text: 'Drill the slow one with a technique rather than by repetition: complements for multiplication
      near a round number, the difference of squares for numbers straddling a multiple of ten, and the
      reciprocal table for fractions. Learn the specific technique, then retest and report the improvement.'
    minutes: 30
  - text: Rebuild the daily drill around what you found, so the remaining sittings train the weak operation
      rather than the whole set.
    minutes: 10
  resources:
  - label: Jane Street — puzzles
    url: https://www.janestreet.com/puzzles/
    kind: problems
  - label: Grinstead & Snell — Introduction to Probability (free PDF)
    url: https://math.dartmouth.edu/~prob/prob/prob.pdf
    kind: textbook
  deliverable: Per-operation timings with the slowest identified, a technique learned for it, and the
    measured improvement.
  checkpoint: Which arithmetic operation is your slowest, and what technique did you learn for it?
  prep_for_tomorrow:
  - 'Arrange a full trading game session for tomorrow: 45 minutes of continuous quoting in the backtester
    with no pauses.'
  - Set it up tonight so no setup time is lost tomorrow.
  - Decide in advance what you will measure.
- day: 342
  date: '2027-07-14'
  weekday: Wednesday
  week: 49
  phase: The interview
  kind: study
  title: A full session, continuous, with no pausing to think
  why: Every previous exercise let you stop, and the round does not, so the last practice of the week
    removes the pause and finds out what degrades.
  objectives:
  - Run a continuous 45-minute quoting session and report profit, inventory and adverse selection.
  - Say which part of your decision quality degraded under continuous pressure.
  tasks:
  - text: 'Run the full session with no pauses and no reference material, keeping a running commentary
      out loud. The commentary is the point: an interviewer is listening to how you decide, and doing
      it while under pressure is the skill that does not transfer from silent practice.'
    minutes: 45
  - text: 'Review the recording rather than only the score: find the point where your reasoning became
      a heuristic instead of a calculation, and note what triggered it. It is usually an unexpected fill
      or a run of losses, and knowing your own trigger is worth more than the profit number.'
    minutes: 15
  resources:
  - label: IMC Prosperity 3 backtester with real round data
    url: https://github.com/jmerle/imc-prosperity-3-backtester
    kind: repo
  - label: Optiver Ready Trader Go — surviving simulator mirror
    url: https://github.com/keanekwa/Optiver-Ready-Trader-Go
    kind: repo
  deliverable: A recorded 45-minute continuous session with profit, inventory and adverse selection reported,
    plus the identified degradation point.
  checkpoint: At what point in the session did your reasoning stop being a calculation, and what triggered
    it?
  prep_for_tomorrow:
  - Update the error log with everything from the trading week.
  - Check your timed mixed-set scores.
  - Nothing to install.
- day: 343
  date: '2027-07-15'
  weekday: Thursday
  week: 49
  phase: The interview
  kind: catchup
  title: Trading games, closed book
  why: Light day. Week 49 is the round furthest from anything in your training, and today checks that
    the objectives are stated rather than felt.
  objectives:
  - State what width and skew each trade off, and how much your fair value should move on a fill.
  - Report your session's profit attribution across the three components.
  tasks:
  - text: Finish anything outstanding from days 337 to 342, then run one more 20-minute quoting session
      focused on the specific weakness you found on day 342 rather than on profit.
    minutes: 30
  - text: 'Closed book: the two quoting objectives, the update rule and what its strength depends on,
      and the three-way profit attribution with your own numbers.'
    minutes: 15
  resources:
  - label: IMC Prosperity 3 backtester with real round data
    url: https://github.com/jmerle/imc-prosperity-3-backtester
    kind: repo
  - label: Jane Street — puzzles
    url: https://www.janestreet.com/puzzles/
    kind: problems
  deliverable: The closed-book week 49 page with the quoting objectives and your own profit attribution.
  checkpoint: State what a quote width trades off and what a skew expresses, in one sentence each.
  prep_for_tomorrow:
  - Write down ten statistics questions you would expect from a quantitative researcher interview.
  - Include at least two about study design rather than about formulas.
  - Tomorrow you answer them against a clock.
  drill:
  - 'Timed mixed set, tenth sitting: five problems in fifteen minutes. Score and plot all ten.'
  - 'Market making, sixth sitting, with a twist: I trade with you and then tell you I will trade again
    in the same direction regardless of your quote. What do you do? The answer is not obvious and saying
    why out loud is the exercise.'
  - The million dollar question, second attempt. Compare against day 294. A good answer says something
    about the horizon you would run it over and the drawdown you would accept, both of which you computed
    on day 129.
- day: 344
  date: '2027-07-16'
  weekday: Friday
  week: 50
  phase: The interview
  kind: study
  title: The statistics round, where you should be strongest
  why: This is the round your training makes you best at and the one you are most likely to over-answer,
    because the assessment is compression rather than depth.
  objectives:
  - Answer ten statistics questions in ninety seconds each, out loud, without exceeding the time.
  - Identify the two answers where you went too deep and rewrite them shorter.
  tasks:
  - text: 'Ninety seconds each, ten questions, recorded. The constraint is the exercise: an answer that
      takes four minutes reads as a lack of judgement rather than as expertise, however correct it is.'
    minutes: 30
  - text: 'Review the recording for the failure mode that is specific to you: starting from the general
      case and working toward the answer, rather than answering and then qualifying. Rewrite the two worst
      offenders in the answer-first form and record them again.'
    minutes: 25
  - text: 'Add the one question you will be asked because of your background: how does genome-wide association
      work and why is the multiple testing problem there the same as in backtesting. Answer it in ninety
      seconds.'
    minutes: 10
  resources:
  - label: Efron & Hastie — Computer Age Statistical Inference
    url: https://hastie.su.domains/CASI/
    kind: textbook
  - label: An Introduction to Statistical Learning (free PDFs, R and Python)
    url: https://www.statlearning.com/
    kind: textbook
  deliverable: Ten recorded ninety-second statistics answers, with two rewritten in answer-first form.
  checkpoint: Explain the multiple testing problem in a genome-wide scan and in a backtest, in ninety
    seconds, and say what is different between them.
  prep_for_tomorrow:
  - Write down ten machine learning questions, weighted toward the ones about validation rather than about
    architectures.
  - Include the one about why cross-validation fails on financial data.
  - File them.
- day: 345
  date: '2027-07-17'
  weekday: Saturday
  week: 50
  phase: The interview
  kind: study
  title: The machine learning round, answered in your own results
  why: You have a year of measured results on exactly these questions, which means every answer can be
    a number from your own work rather than a textbook statement, and that is what distinguishes the answer.
  objectives:
  - Answer ten machine learning questions in ninety seconds each, citing your own measured numbers where
    you have them.
  - State the audit result from milestone 7 as a two-sentence answer.
  tasks:
  - text: Ninety seconds each, recorded, with the rule that where you have your own number you use it.
      Purging and embargoing, the seed variance result, the effective sample size correction and the audit
      verdict are all things you measured, and citing them is far stronger than describing the technique.
    minutes: 35
  - text: 'Prepare the follow-up you will get: an interviewer who hears that boosting did not beat ridge
      will ask why, and the answer has to be specific rather than a shrug about signal to noise. Write
      the three-part answer covering the effective sample size, the turnover, and the fact that the interactions
      were not there.'
    minutes: 25
  resources:
  - label: Gu, Kelly & Xiu (2020) — Empirical Asset Pricing via Machine Learning
    url: https://dachxiu.chicagobooth.edu/download/ML.pdf
    kind: paper
  - label: Stanford CS229 — Machine Learning, main lecture notes (PDF)
    url: https://cs229.stanford.edu/main_notes.pdf
    kind: reference
  deliverable: Ten recorded machine learning answers citing your own measured numbers, plus the prepared
    three-part follow-up.
  checkpoint: Standard k-fold is wrong on financial data. Give two reasons, the fixes, and the number
    from your own work that shows the fix mattered.
  prep_for_tomorrow:
  - 'Set up a timed coding environment: a blank file, a timer, and no internet.'
  - Pick three problems from your phase 7 and phase 10 drills that you have not solved recently.
  - Tomorrow is forty-five minutes of writing code under a clock.
- day: 346
  date: '2027-07-18'
  weekday: Sunday
  week: 50
  phase: The interview
  kind: study
  title: The coding round, under a clock and out loud
  why: The failure mode here is silence, not incorrectness, and the only way to fix it is to practise
    narrating while writing, which feels absurd until the first real screen.
  objectives:
  - Solve three problems in forty-five minutes while narrating, and state the complexity of each before
    writing it.
  - Identify the point where you stopped talking, and what you were doing then.
  tasks:
  - text: Forty-five minutes, three problems, narrating continuously and recording. State the approach
      and its complexity before writing anything, which is what interviewers ask for and what most candidates
      skip. Aim for working code over elegant code and say when you are choosing that.
    minutes: 45
  - text: Review the recording for silences longer than fifteen seconds, and note what you were doing
      in each. The usual cause is a bug, and the correct behaviour is to narrate the debugging rather
      than to go quiet, because the debugging is the part they most want to see.
    minutes: 15
  resources:
  - label: PostgreSQL Exercises — graded, in-browser
    url: https://pgexercises.com/
    kind: problems
  - label: SQLBolt — 18 interactive SQL lessons
    url: https://sqlbolt.com/
    kind: course
  deliverable: Three problems solved in forty-five minutes with a recording, and every silence longer
    than fifteen seconds annotated.
  checkpoint: You hit a bug three minutes into a coding round. What do you say out loud, and what do you
    not do?
  prep_for_tomorrow:
  - Reread your five-minute research presentation script from day 315 and time it again.
  - Note where it runs long.
  - Tomorrow it gets cut rather than polished.
- day: 347
  date: '2027-07-19'
  weekday: Monday
  week: 50
  phase: The interview
  kind: study
  title: The research presentation, cut to what a stranger needs
  why: Nine rehearsals since day 203 have made it fluent and probably not shorter, and the failure mode
    of an academic presenting to a quantitative audience is context that the audience does not need.
  objectives:
  - Deliver the presentation in five minutes with one result leading and the method reduced to two sentences.
  - Answer three hostile follow-up questions about the result's robustness.
  tasks:
  - text: 'Cut rather than polish: lead with the result, give the method in two sentences, and spend the
      remaining time on why the result is credible and what would falsify it. A quantitative audience
      wants the estimate, the uncertainty and the threat to validity, in that order, and nothing about
      the biological background.'
    minutes: 30
  - text: 'Prepare for the follow-ups you will actually get: how do you know it is causal, what is the
      effect size and is it meaningful, and what would have made you not believe it. Write and rehearse
      the answer to each, since they are the same three questions asked of any empirical claim and you
      will get them in every interview.'
    minutes: 30
  resources:
  - label: Two Sigma — Insights
    url: https://www.twosigma.com/insights/
    kind: reference
  - label: Jane Street — Signals and Threads podcast
    url: https://signalsandthreads.com/
    kind: reference
  deliverable: A five-minute presentation recorded, leading with the result, plus rehearsed answers to
    three robustness questions.
  checkpoint: Present your genetics research in five minutes to someone quantitative who knows no biology.
    Which single result do you lead with?
  prep_for_tomorrow:
  - Write down what you would say if asked what you find interesting about markets right now.
  - It should not be a summary of the news.
  - One paragraph, and it will be worse than you expect.
- day: 348
  date: '2027-07-20'
  weekday: Tuesday
  week: 50
  phase: The interview
  kind: study
  title: The market intuition questions, answered as a researcher
  why: You are not expected to have a view on rates, but you are expected to be able to reason about a
    market question from evidence, and the failure is either bluffing or refusing to engage.
  objectives:
  - Answer three open market questions in the form of a research approach rather than a prediction.
  - State what you would need to measure to have a view, for each.
  tasks:
  - text: Answer three questions of the form what do you find interesting about markets, what would you
      research first if you joined, and what do you think about a named phenomenon. The good answer names
      something you have actually measured this year, states what surprised you, and says what you would
      do next. Your day 307 revision table is full of material for this.
    minutes: 30
  - text: 'Practise the honest non-answer: for a question you have no basis for, the correct response
      says so and then says what evidence would change that, which is a stronger answer than a guess.
      Rehearse it once so that it comes out as confidence rather than as evasion.'
    minutes: 30
  resources:
  - label: Man Group — Man Insights
    url: https://www.man.com/insights
    kind: reference
  - label: AQR — Research and Insights
    url: https://www.aqr.com/Insights/Research
    kind: reference
  deliverable: Three recorded answers to open market questions grounded in your own measurements, plus
    a rehearsed honest non-answer.
  checkpoint: What would you research first if you joined tomorrow, and what have you already measured
    that makes you think so?
  prep_for_tomorrow:
  - Listen to your three recordings of the academia question from days 287, 308 and 329.
  - Write down what changed and what did not.
  - The part that did not change is tomorrow's work.
- day: 349
  date: '2027-07-21'
  weekday: Wednesday
  week: 50
  phase: The interview
  kind: study
  title: The questions academics answer badly
  why: Three attempts at the academia question and the defensive part has probably survived all three,
    which is worth fixing because it is the question that decides whether the rest of the interview is
    read charitably.
  objectives:
  - Answer the leaving-academia question in three sentences that a researcher at the firm would find convincing
    rather than polite.
  - Answer the money question in a way that says something about how you think about risk.
  tasks:
  - text: 'Rewrite the academia answer around what you want rather than what you are leaving: faster feedback
      loops, decisions with money attached, and a field where being wrong is measurable within months.
      Then remove every clause about what is wrong with academia, because those clauses are what make
      it sound defensive.'
    minutes: 30
  - text: 'Prepare the other three: what would you do with a million dollars, where do you want to be
      in five years, and why this firm. The first is a risk question, the second is answered badly by
      saying running my own fund to someone who is hiring you, and the third requires the firm list you
      build on day 353.'
    minutes: 30
  resources:
  - label: Jane Street — tech blog
    url: https://blog.janestreet.com/
    kind: reference
  - label: Two Sigma — Insights
    url: https://www.twosigma.com/insights/
    kind: reference
  deliverable: Four rehearsed behavioural answers recorded, with the academia one under forty-five seconds
    and free of complaint.
  checkpoint: Why are you leaving academia? Three sentences, and a researcher at the firm has to find
    it convincing rather than polite.
  prep_for_tomorrow:
  - Assemble the recordings from this week into one folder and listen to the worst one.
  - Write down the single change that would improve it most.
  - Check your timed mixed-set scores; tomorrow is the eleventh sitting.
- day: 350
  date: '2027-07-22'
  weekday: Thursday
  week: 50
  phase: The interview
  kind: catchup
  title: The other rounds, closed book
  why: Light day. Week 50 covered four rounds and the common failure across all of them is length, so
    today is about the compression rather than the content.
  objectives:
  - Deliver any of the week's answers on demand within its time limit.
  - Name the one habit that most damages your answers and say what you are doing about it.
  tasks:
  - text: 'Finish anything outstanding from days 344 to 349, then run a random-order set: someone or something
      picks five of the week''s questions at random and you answer each within its limit, cold. Cold and
      out of order is the condition that matters.'
    minutes: 35
  - text: 'Name the habit: it will be one of starting general before answering, over-qualifying, or going
      silent when stuck. Write down the specific replacement behaviour rather than an intention to do
      better.'
    minutes: 15
  resources:
  - label: Jane Street — puzzle archive with solutions
    url: https://www.janestreet.com/puzzles/archive/index.html
    kind: problems
  - label: An Introduction to Statistical Learning (free PDFs, R and Python)
    url: https://www.statlearning.com/
    kind: textbook
  deliverable: Five cold random-order answers within their time limits, plus your named habit and its
    replacement behaviour.
  checkpoint: Which habit most damages your interview answers, and what is the specific replacement?
  prep_for_tomorrow:
  - Print your current CV and read it as though you were screening it for a quantitative research role.
  - Mark every line that would mean nothing to that reader.
  - There will be many. Do not rewrite anything tonight.
  drill:
  - 'Timed mixed set, eleventh sitting: five problems in fifteen minutes. Score and plot all eleven.'
  - 'A full mock round, first attempt: fifteen minutes of mixed probability, market making and a behavioural
    question, in one sitting, with no breaks between them. The transitions are what is being practised.'
  - 'Estimation under adversarial follow-up: give a Fermi estimate, then defend it when told it is wrong
    by a factor of ten. The correct response identifies which assumption would have to be wrong, rather
    than revising the answer.'
- day: 351
  date: '2027-07-23'
  weekday: Friday
  week: 51
  phase: The interview
  kind: study
  title: The CV, rewritten without overclaiming or disowning
  why: 'The failure modes are opposite and both common: describing genetics work in its own vocabulary
    so nobody reads it, or dressing it up as finance so a researcher stops trusting you in the second
    line.'
  objectives:
  - Rewrite the research section in the language of the job without misdescribing what you did.
  - Have every line on the first page either state a measurable result or a technique the reader recognises.
  tasks:
  - text: 'Rewrite the research section: Mendelian randomization becomes instrumental variable estimation
      with weak-instrument diagnostics, a genome-wide scan becomes high-dimensional multiple testing with
      a controlled error rate, and colocalization becomes Bayesian model comparison over shared causal
      variants. Each of those is true and each is a technique the reader uses.'
    minutes: 30
  - text: 'Add this year''s work with numbers rather than nouns: the platform with its test suite, the
      alpha book with its specification count, the audit with its interval, and the paper-traded track
      record with its length. Then cut everything from the first page that is neither a result nor a recognised
      technique.'
    minutes: 30
  resources:
  - label: Two Sigma — Insights
    url: https://www.twosigma.com/insights/
    kind: reference
  - label: AQR — Research and Insights
    url: https://www.aqr.com/Insights/Research
    kind: reference
  deliverable: A rewritten CV whose first page contains only measurable results and recognised techniques.
  checkpoint: Describe your thesis work in the vocabulary of quantitative research, in three sentences,
    without overclaiming.
  prep_for_tomorrow:
  - Reread milestones 5, 6 and 8 and time how long each takes to understand.
  - If any takes more than ten minutes, note where you stalled.
  - Tomorrow they get cut to two pages each.
- day: 352
  date: '2027-07-24'
  weekday: Saturday
  week: 51
  phase: The interview
  kind: study
  title: Three write-ups a stranger can read in ten minutes
  why: Nobody reads a forty-page report, and the two-page version is a different document rather than
    a shorter one, which is why it takes a day rather than an hour.
  objectives:
  - Produce two-page versions of three milestones, each readable in ten minutes by someone who has not
    seen the rest.
  - Have each open with the result and the caveat rather than with the method.
  tasks:
  - text: 'Write the two-page version of the platform, the alpha book and the option pricer: what it is,
      one figure, the result with its interval, the specification count where relevant, and the limitation
      you consider most serious. Method goes in a short section rather than at the front.'
    minutes: 35
  - text: 'Test them: give one to someone outside the field and ask what they think it claims. Where they
      get it wrong, the document is wrong rather than the reader. If nobody is available, leave it for
      a day and reread it cold, which catches perhaps half of what a reader would.'
    minutes: 25
  resources:
  - label: Jane Street — tech blog
    url: https://blog.janestreet.com/
    kind: reference
  - label: Man Group — Man Insights
    url: https://www.man.com/insights
    kind: reference
  deliverable: Two-page versions of three milestones, each tested on a reader or reread cold.
  checkpoint: Hand someone your platform write-up. What do they think it claims after ten minutes, and
    is that what you meant?
  prep_for_tomorrow:
  - List every firm you can name that hires buy-side quantitative researchers. Aim for thirty.
  - Do not filter or rank yet.
  - Note which ones you know something specific about, which will be few.
  project: 'The three write-ups are the form in which the year''s work actually gets read: result first,
    one figure, interval, specification count, and the most serious limitation, each in two pages.'
- day: 353
  date: '2027-07-25'
  weekday: Sunday
  week: 51
  phase: The interview
  kind: study
  title: The firm list, with a reason next to each name
  why: A list without reasons produces identical applications, and the reason next to each name is what
    makes the outreach on day 354 worth sending.
  objectives:
  - Reduce the list to fifteen firms, each with a specific reason and a named team or research area.
  - Classify each by structure, since a pod shop, a partnership and a systematic manager want different
    things from you.
  tasks:
  - text: 'Research rather than recall: for each firm, find something specific from its own research page,
      blog or published papers, and write the reason from that. Two Sigma, Man, AQR and Jane Street all
      publish, so the specific reason is available for at least a third of your list without any inside
      knowledge.'
    minutes: 35
  - text: 'Classify by structure and match it to yourself: a multi-manager pod is a fast, capital-allocated
      seat with a short leash, a partnership is a longer horizon with a harder entry bar, and a systematic
      manager is closest to what you have spent the year doing. Rank the fifteen by fit rather than by
      prestige, and write the ranking down so the outreach order is decided in advance.'
    minutes: 25
  resources:
  - label: Two Sigma — Insights
    url: https://www.twosigma.com/insights/
    kind: reference
  - label: Man Group — Man Insights
    url: https://www.man.com/insights
    kind: reference
  - label: AQR — Research and Insights
    url: https://www.aqr.com/Insights/Research
    kind: reference
  deliverable: Fifteen firms with a specific reason, a named team or research area, a structural classification
    and a fit ranking.
  checkpoint: Name three firms on your list and say, for each, the specific thing that put it there.
  prep_for_tomorrow:
  - Find three people who moved from a quantitative science PhD into this industry, through your own network
    or through published author lists.
  - Note what they worked on before and where they are now.
  - Do not contact anyone tonight.
- day: 354
  date: '2027-07-26'
  weekday: Monday
  week: 51
  phase: The interview
  kind: study
  title: Outreach that is worth the recipient's two minutes
  why: A referral changes the outcome more than any other single factor, and the only way to get one is
    a message specific enough that answering it is easy.
  objectives:
  - Write and send three outreach messages, each referencing something specific the recipient did.
  - State what you are asking for, which is a conversation rather than a job.
  tasks:
  - text: 'Write three messages, each under 150 words: who you are in one sentence, the specific thing
      of theirs you read and one real question about it, what you have built this year in one clause,
      and a clear small ask. The question about their work is what makes it a message rather than a request.'
    minutes: 30
  - text: 'Send them, and set up the follow-up discipline: a tracker with the date sent, the ask, and
      a follow-up date two weeks out. Then write the two-sentence follow-up now, while you are not disappointed,
      because writing it later is harder.'
    minutes: 20
  - text: 'Draft the version for people you do not know at all, which is a different message: shorter,
      with a link to one write-up rather than an attachment, and a smaller ask.'
    minutes: 10
  resources:
  - label: Jane Street — Signals and Threads podcast
    url: https://signalsandthreads.com/
    kind: reference
  - label: Two Sigma — Insights
    url: https://www.twosigma.com/insights/
    kind: reference
  deliverable: Three outreach messages sent, a tracker with follow-up dates, and a pre-written follow-up.
  checkpoint: What are you actually asking for in an outreach message, and why is asking for a job the
    wrong ask?
  prep_for_tomorrow:
  - Arrange a mock interview for tomorrow with a real person if you can, and a full self-run version if
    you cannot.
  - Send them three probability problems and one behavioural question in advance so they do not have to
    prepare.
  - Block ninety minutes.
- day: 355
  date: '2027-07-27'
  weekday: Tuesday
  week: 51
  phase: The interview
  kind: study
  title: A full mock, with the transitions included
  why: You have practised every round separately, and the thing that has not been practised is moving
    from a probability question to a behavioural one to a coding problem without resetting.
  objectives:
  - Complete a full-length mock covering four round types with no breaks.
  - Identify the transition that cost you most and say what you will do about it.
  tasks:
  - text: 'Run the full mock: probability under a clock, a trading game, the research presentation with
      follow-ups, and two behavioural questions, back to back with no pauses. Record it. The fatigue and
      the transitions are what is being tested, not any individual answer.'
    minutes: 45
  - text: 'Review with a specific question rather than generally: where did the quality drop, and was
      it fatigue, a transition, or a single bad question that you did not recover from. The recovery failure
      is the most common and the most fixable.'
    minutes: 15
  resources:
  - label: Jane Street — puzzles
    url: https://www.janestreet.com/puzzles/
    kind: problems
  - label: IMC Prosperity 3 backtester with real round data
    url: https://github.com/jmerle/imc-prosperity-3-backtester
    kind: repo
  deliverable: A recorded full-length mock across four round types with the weakest transition identified.
  checkpoint: You answered one question badly in the middle of a superday. What do you do in the next
    ninety seconds?
  prep_for_tomorrow:
  - Write down what you think a first-year quantitative researcher is paid, split into base, sign-on and
    bonus.
  - Then write down which of the three is negotiable.
  - You will probably get the second part wrong.
- day: 356
  date: '2027-07-28'
  weekday: Wednesday
  week: 51
  phase: The interview
  kind: study
  title: How an offer is actually structured and what moves
  why: The components are not equally negotiable and the leverage comes from having a second process running,
    which is a scheduling decision made months earlier rather than a negotiating tactic.
  objectives:
  - State the components of a quantitative research offer and which are negotiable.
  - State what creates leverage and what you would do with an exploding offer.
  tasks:
  - text: 'Write out the structure: base, sign-on, guaranteed first-year bonus, discretionary bonus, deferred
      compensation and its vesting, and any non-compete. The sign-on and the guarantee move most easily,
      the base moves within a band, and the deferral schedule is usually firm. The non-compete is the
      term that most affects your next five years and the one candidates ignore.'
    minutes: 30
  - text: 'Plan the timing: leverage comes from parallel processes finishing near each other, which means
      starting applications in a batch rather than sequentially. Write your target application window
      and the sequencing, and note what you would say to an exploding offer, which is a specific sentence
      rather than a strategy.'
    minutes: 25
  - text: Write the two-sentence version of what you would accept and what you would decline, so the decision
      is made before the pressure rather than during it.
    minutes: 10
  resources:
  - label: Jane Street — tech blog
    url: https://blog.janestreet.com/
    kind: reference
  - label: Two Sigma — Insights
    url: https://www.twosigma.com/insights/
    kind: reference
  deliverable: A written offer structure with negotiability marked, an application sequencing plan, and
    your pre-decided acceptance criteria.
  checkpoint: Which parts of an offer are negotiable, what creates the leverage, and what do you say to
    an exploding one?
  prep_for_tomorrow:
