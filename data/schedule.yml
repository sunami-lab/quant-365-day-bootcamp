  prep_for_tomorrow:
  - Rewrite one dataframe operation from your bottleneck in polars and time it against the pandas version.
  - Use the same input and check the outputs match exactly.
  - Two numbers and one equality check.
- day: 313
  date: '2027-06-15'
  weekday: Tuesday
  week: 45
  phase: Production
  kind: study
  title: Polars, and being specific about where it wins
  why: The speedups quoted in benchmarks are for operations you may not do, so the useful exercise is
    measuring your own pipeline rather than reading someone else's chart.
  objectives:
  - Report the speedup on your own three heaviest operations, and identify one where the gain is small.
  - Say what the lazy execution model changes about how you write a query.
  tasks:
  - text: 'Port the three benchmark operations to polars and report the ratio for each. Then find one
      where the gain is small and explain it: operations dominated by a single column scan or by output
      serialisation gain little, while group-by and join heavy work gains a lot.'
    minutes: 30
  - text: Use the lazy API on the largest one and look at the query plan. The optimiser reorders filters
      and prunes columns, which means the way you write the query matters less than in pandas, and seeing
      the plan once is what makes that concrete.
    minutes: 25
  - text: 'Decide what to migrate: the rule is to port only what the benchmark says is worth porting,
      and to leave working pandas code alone. Write the decision down so you do not drift into a half-migrated
      codebase.'
    minutes: 10
  resources:
  - label: Polars user guide
    url: https://docs.pola.rs/
    kind: tool
  - label: pandas documentation
    url: https://pandas.pydata.org/docs/
    kind: tool
  deliverable: Speedup ratios for three operations with one small-gain case explained, plus a written
    migration decision.
  checkpoint: Which of your operations gained least from polars, and what property of it explains that?
  prep_for_tomorrow:
  - Find one place in your code where you genuinely need a loop that cannot be vectorised.
  - A path-dependent calculation such as a drawdown or a stop-loss simulation is the usual case.
  - Time it and write the number down.
- day: 314
  date: '2027-06-16'
  weekday: Wednesday
  week: 45
  phase: Production
  kind: study
  title: Numba, for the loops that cannot be vectorised
  why: Path-dependent logic is the one case where a loop is the right algorithm, and it is exactly where
    pure Python is slowest, which is a narrow but real gap worth closing.
  objectives:
  - Compile one path-dependent function with numba and report the speedup against the pure Python and
    the vectorised versions.
  - Say what numba cannot compile and how you find out before deploying it.
  tasks:
  - text: Compile your loop in no-python mode and measure it against the pure Python version and against
      any vectorised approximation. Report all three times and confirm the outputs match. Path-dependent
      code often shows two orders of magnitude, which is the largest single gain available in this phase.
    minutes: 30
  - text: 'Find the boundaries: numba silently falls back to object mode unless you forbid it, which produces
      code that is slower and looks compiled. Force strict mode, then deliberately write something it
      cannot compile and observe the error rather than the silent fallback.'
    minutes: 20
  - text: Rerun the benchmark harness and record the new baseline, so the phase's cumulative improvement
      is a number rather than an impression.
    minutes: 10
  resources:
  - label: Numba documentation
    url: https://numba.readthedocs.io/en/stable/
    kind: tool
  - label: Cython documentation
    url: https://cython.readthedocs.io/en/latest/
    kind: tool
  deliverable: A numba-compiled path-dependent function with three timings compared and outputs verified
    identical, plus an updated benchmark baseline.
  checkpoint: Your numba function is only twice as fast. What is the first thing to check?
  prep_for_tomorrow:
  - Record the cumulative speedup of your pipeline across the week from the benchmark harness.
  - Check your timed mixed-set scores.
  - Nothing to install.
- day: 315
  date: '2027-06-17'
  weekday: Thursday
  week: 45
  phase: Production
  kind: catchup
  title: The data layer, closed book
  why: Light day. Week 45 is engineering rather than finance, and the recall that matters is the decision
    rules rather than the syntax.
  objectives:
  - State when a computation belongs in SQL, in polars, in numpy and in a compiled loop.
  - Give the cumulative speedup of your pipeline and which change contributed most.
  tasks:
  - text: Finish anything outstanding from days 309 to 314. The benchmark harness is the piece to have
      committed, because week 47's scheduled pipeline has to run inside a time budget.
    minutes: 20
  - text: 'Closed book: the four-way decision rule for where a computation belongs, the two mechanisms
      Parquet uses to read less, and the cumulative speedup with its largest contributor.'
    minutes: 15
  resources:
  - label: PostgreSQL Exercises — graded, in-browser
    url: https://pgexercises.com/
    kind: problems
  - label: Modern SQL (Winand) — window functions, CTEs
    url: https://modern-sql.com/
    kind: reference
  deliverable: The closed-book week 45 page, the gaps-and-islands query working against your own data,
    and a recorded five-minute research presentation.
  checkpoint: 'Where does a computation belong: SQL, polars, numpy or a compiled loop? Give the rule and
    one example of each.'
  prep_for_tomorrow:
  - Install a C++ compiler and confirm it works on a hello world.
  - 'Read the first two chapters of LearnCpp: the compilation model and basic syntax.'
  - Twenty minutes. You are learning to read C++, not to write it professionally.
  drill:
  - 'Timed mixed set, sixth sitting: five problems in fifteen minutes. Score and plot.'
  - 'A SQL problem at the harder end: from a positions table with daily snapshots per symbol, write a
    query that finds, for each symbol, the longest consecutive run of days it was held. Gaps and islands
    is the pattern; write it with window functions.'
  - 'Research presentation, sixth sitting: five minutes, the full version, timed. Record it. This is the
    first time you should be at full length and it will be too long.'
- day: 316
  date: '2027-06-18'
  weekday: Friday
  week: 46
  phase: Production
  kind: study
  title: Enough C++ to read a codebase without guessing
  why: You will be shown C++ in an interview and you will want to read exchange and engine code, and reading
    is a far smaller skill than writing, which is what this week targets.
  objectives:
  - Read a short C++ function and say what is copied, what is referenced and what is moved.
  - State what the compilation model does that Python's does not, and what that buys.
  tasks:
  - text: Work through LearnCpp's chapters on fundamental types, references and pointers, and const. The
      three ideas you need are that objects have declared types known at compile time, that a reference
      is an alias rather than a pointer, and that const is part of the type.
    minutes: 35
  - text: 'Read and annotate: take twenty lines of real C++ from the LEAN engine or any open source order
      book, and annotate every line with what is copied and what is referenced. Getting this right is
      most of what reading C++ requires.'
    minutes: 25
  resources:
  - label: LearnCpp — free structured C++ course
    url: https://www.learncpp.com/
    kind: course
  - label: cppreference — C and C++ standard library reference
    url: https://en.cppreference.com/w/
    kind: reference
  deliverable: Twenty lines of real C++ annotated line by line with what is copied, referenced and moved.
  checkpoint: Given a function signature taking a const reference, say what that guarantees the function
    will and will not do.
  prep_for_tomorrow:
  - 'Write two C++ programs that sum a large array: one over an array of structs, one over a struct of
    arrays.'
  - Time both.
  - The difference will be large and tomorrow explains it.
- day: 317
  date: '2027-06-19'
  weekday: Saturday
  week: 46
  phase: Production
  kind: study
  title: Memory layout, and why one loop is four times faster
  why: The timing difference you found last night has nothing to do with the language and everything to
    do with what the cache line contains, which is the single most useful performance idea in this week.
  objectives:
  - Explain the array-of-structs against struct-of-arrays result in terms of cache lines and prefetching.
  - Say what that implies for how a tick database should be laid out, and connect it to your Parquet work.
  tasks:
  - text: 'Explain your measurement: a cache line brings in 64 bytes, so iterating over one field of a
      struct array wastes most of every line, while a columnar layout uses all of it. Then vary the struct
      size and plot the timing ratio against it, which makes the mechanism visible rather than asserted.'
    minutes: 30
  - text: 'Connect it back: Parquet is struct-of-arrays on disk for the same reason, and your day 311
      measurement of bytes read is the same effect one level up the hierarchy. Write the connection down,
      since it is the answer to the tick database question you will be asked.'
    minutes: 20
  - text: 'Add the second effect: measure a random access pattern over the same array against a sequential
      one, and report the ratio. Prefetching only helps when the access is predictable.'
    minutes: 10
  resources:
  - label: Modern C++ Tutorial (Ou) — C++11 to C++26
    url: https://changkun.de/modern-cpp/
    kind: textbook
  - label: Jane Street — tech blog
    url: https://blog.janestreet.com/
    kind: reference
  deliverable: Timing ratio plotted against struct size, plus a random-against-sequential access comparison
    and the written connection to Parquet.
  checkpoint: Why is a columnar layout faster for a scan, and how does that answer the question about
    storing a tick database?
  prep_for_tomorrow:
  - Read the cppreference pages for vector, unordered_map and map, and note the complexity guarantees
    of each operation.
  - Then write down which you would use for an order book's price levels and which for its order lookup.
  - Two choices with reasons.
- day: 318
  date: '2027-06-20'
  weekday: Sunday
  week: 46
  phase: Production
  kind: study
  title: Containers, their complexity, and their constant factors
  why: Choosing a container by its complexity class alone is how you end up with an asymptotically optimal
    book that is slower than an array, and knowing why is a standard interview subject.
  objectives:
  - Choose the right container for an order book's two access patterns and defend each choice.
  - Say when a vector beats a hash map despite worse complexity, and demonstrate it.
  tasks:
  - text: 'Measure the constant factors: time lookups in a vector, a sorted vector with binary search,
      an unordered map and an ordered map, across sizes from 8 to 100,000 elements. Plot time against
      size for all four. Below a few hundred elements the linear scan over a contiguous vector usually
      wins, and that crossover point is the thing to know.'
    minutes: 35
  - text: 'Apply it to the design: an order book has few price levels near the touch and many orders,
      so the price levels want a sorted contiguous structure and the order lookup wants a hash map. Write
      the design down with the reasoning attached, since it is exactly the question that gets asked.'
    minutes: 25
  resources:
  - label: cppreference — C and C++ standard library reference
    url: https://en.cppreference.com/w/
    kind: reference
  - label: C++ Core Guidelines (Stroustrup & Sutter)
    url: https://isocpp.github.io/CppCoreGuidelines/CppCoreGuidelines
    kind: reference
  deliverable: Lookup timings for four containers across six sizes with the crossover identified, plus
    a written order book data structure design.
  checkpoint: Why might a linear scan over a vector beat a hash map lookup, and at roughly what size does
    that stop being true?
  prep_for_tomorrow:
  - Find the matching engine or order book component in the LEAN repository or any open source exchange
    simulator.
  - Read the main data structures without trying to follow the whole flow.
  - Note the two decisions they made that differ from your design.
- day: 319
  date: '2027-06-21'
  weekday: Monday
  week: 46
  phase: Production
  kind: study
  title: Reading someone else's matching engine
  why: Reading production code you did not write is the skill this week is actually for, and a matching
    engine is a good target because you already know exactly what it has to do.
  objectives:
  - Trace an order through a real engine's code from submission to fill.
  - Name two design decisions it makes that yours does not, and say what each buys.
  tasks:
  - text: 'Trace the path: find where an order enters, where it is validated, where it is matched and
      where the fill is published. Draw the call path on paper rather than in your head. The parts you
      cannot follow are as informative as the parts you can, so write those down too.'
    minutes: 35
  - text: 'Compare against your own toy book from day 9 and day 281: what does the real engine handle
      that yours does not? Self-trade prevention, order modification semantics, and the sequencing guarantees
      under concurrent input are the three you will find, and each of them is a correctness requirement
      rather than a feature.'
    minutes: 25
  resources:
  - label: LEAN — source repository
    url: https://github.com/QuantConnect/Lean
    kind: repo
  - label: NautilusTrader documentation
    url: https://nautilustrader.io/docs/
    kind: tool
  deliverable: A hand-drawn call path for an order through a real engine, with three handled cases your
    own book does not cover.
  checkpoint: What is self-trade prevention, and what goes wrong without it?
  prep_for_tomorrow:
  - 'Sketch the C++ classes for a minimal order book: an order, a price level, and the book itself.'
  - Decide the container for each from day 318's measurements.
  - Three sketches, no code.
- day: 320
  date: '2027-06-22'
  weekday: Tuesday
  week: 46
  phase: Production
  kind: study
  title: Writing a small order book that works
  why: Writing a hundred lines that compile and behave correctly is a different and more convincing skill
    than reading, and it is the artifact that makes the C++ line on your CV defensible.
  objectives:
  - Implement an order book in C++ supporting add, cancel and market order execution with price-time priority.
  - Test it against your Python implementation on the same message sequence and get identical results.
  tasks:
  - text: 'Write it: the three classes from last night, with the containers you chose, and the three operations.
      Keep it under two hundred lines and compile with warnings as errors. Getting it to compile is a
      real part of the exercise and the error messages are where most of the learning is.'
    minutes: 40
  - text: 'Test it against something you trust: replay a slice of your ITCH sample through both your Python
      book and the C++ one and assert the resulting books match at every step. Identical output on real
      message sequences is a much stronger test than any unit test you would have written.'
    minutes: 20
  resources:
  - label: LearnCpp — free structured C++ course
    url: https://www.learncpp.com/
    kind: course
  - label: C++ Core Guidelines (Stroustrup & Sutter)
    url: https://isocpp.github.io/CppCoreGuidelines/CppCoreGuidelines
    kind: reference
  deliverable: A compiling C++ order book under two hundred lines, verified against the Python implementation
    on a real ITCH slice.
  checkpoint: What does your C++ book do when a cancel arrives for an order that already fully executed?
  prep_for_tomorrow:
  - Time your Python book and your C++ book on the same million-message replay.
  - Write both numbers down.
  - Then guess how much of the gap is the language and how much is the data structure.
- day: 321
  date: '2027-06-23'
  weekday: Wednesday
  week: 46
  phase: Production
  kind: study
  title: The gap between the two, decomposed
  why: Reporting a speedup without decomposing it is how people conclude that C++ is fast when what they
    measured was that dictionaries are slow, and separating the two is worth an hour.
  objectives:
  - Decompose the Python-to-C++ speedup into interpreter overhead and data structure difference.
  - Say what you would do to close most of the gap without leaving Python, and measure it.
  tasks:
  - text: 'Isolate the causes: write a third version in Python using the same data structures as your
      C++ book, and a fourth using numba on the hot loop. Time all four on the same replay. The four numbers
      separate the language from the layout, which is the honest decomposition.'
    minutes: 35
  - text: 'Draw the conclusion for your own work: with your latencies from day 304, decide whether any
      part of your production stack needs C++ at all. The answer is almost certainly no, and being able
      to say that with measurements behind it is a better interview answer than claiming to be a C++ programmer.'
    minutes: 25
  resources:
  - label: Numba documentation
    url: https://numba.readthedocs.io/en/stable/
    kind: tool
  - label: Cython documentation
    url: https://cython.readthedocs.io/en/latest/
    kind: tool
  deliverable: Four implementations timed on the same replay with the speedup decomposed between language
    and data structure.
  checkpoint: Explain to a C++ programmer why your Python is slow, and name the two changes that would
    help most.
  prep_for_tomorrow:
  - Write one paragraph on what you can now honestly claim about C++ on a CV.
  - It should be about reading and reasoning rather than about writing production systems.
  - Check your timed mixed-set scores.
- day: 322
  date: '2027-06-24'
  weekday: Thursday
  week: 46
  phase: Production
  kind: catchup
  title: C++ literacy, closed book
  why: Light day. Week 46 was about being able to read and to reason rather than to build, and today checks
    that the claim you would make is one you can support.
  objectives:
  - State the latency numbers and the cache line argument from memory.
  - Say honestly what you can and cannot do in C++, in the words you would use in an interview.
  tasks:
  - text: Finish anything outstanding from days 316 to 321. The C++ book verified against the Python one
      is the artifact worth having, because it is the concrete thing behind any claim you make.
    minutes: 20
  - text: 'Closed book: the latency card, the cache line argument, the container crossover, and the four-way
      decomposition of your speedup. Then write the two sentences you would actually say when asked about
      C++.'
    minutes: 15
  resources:
  - label: cppreference — C and C++ standard library reference
    url: https://en.cppreference.com/w/
    kind: reference
  - label: Jane Street — puzzles
    url: https://www.janestreet.com/puzzles/
    kind: problems
  deliverable: The closed-book week 46 page, plus the two sentences you would say about your C++ ability.
  checkpoint: Give the latency numbers for cache, memory, SSD and a data centre round trip, then say what
    they imply for a tick store.
  prep_for_tomorrow:
  - Write out the steps your daily production run has to perform, in order, with the input and output
    of each.
  - There should be six or seven.
  - Note which ones can fail in a way that is not an exception.
  drill:
  - 'Timed mixed set, seventh sitting: five problems in fifteen minutes. Score and plot.'
  - 'A systems question: you need to store five years of tick data for 500 symbols and query arbitrary
    time ranges. Describe your storage design in two minutes, out loud, with the latency numbers behind
    each choice. This is a question with no single right answer and the reasoning is what is scored.'
  - 'Market making, fourth sitting: I quote a market in a quantity you can estimate better than I can.
    Trade with me, then tell me what you learned from the fact that I was willing to trade at that price.'
- day: 323
  date: '2027-06-25'
  weekday: Friday
  week: 47
  phase: Production
  kind: study
  title: The daily run, as a sequence of steps that can each fail
  why: Week 47 turns the research pipeline into a scheduled system, and the design that matters is which
    failures are loud and which are silent, because the silent ones are the expensive ones.
  objectives:
  - Implement the daily run as an ordered set of steps, each with an explicit success condition rather
    than an absence of exceptions.
  - Name the three failures that would not raise an exception and say how each is detected.
  tasks:
  - text: 'Write qlib/run/daily.py: ingest, validate, compute signals, construct the portfolio, generate
      orders, submit, and reconcile. Each step returns a status with the checks it performed, and a step
      that produced no data succeeds only if producing no data was expected on that date.'
    minutes: 35
  - text: 'Enumerate the silent failures and add a check for each: stale data that is present but unchanged
      from yesterday, a signal that computed but is outside its historical range, and an order set that
      is empty because a join failed rather than because the strategy wanted no positions. Those three
      account for most silent production failures in this kind of system.'
    minutes: 25
  resources:
  - label: NautilusTrader documentation
    url: https://nautilustrader.io/docs/
    kind: tool
  - label: Docker — get started
    url: https://docs.docker.com/get-started/
    kind: course
  deliverable: A daily run script with per-step success conditions and three silent-failure checks implemented.
  checkpoint: Your pipeline silently produced yesterday's signal today. Which check catches it, and why
    is job succeeded not that check?
  prep_for_tomorrow:
  - Look at whatever logging your code currently does and write down a question you would want to answer
    from it in three months.
  - Then check whether you could.
  - You almost certainly could not, and that gap is tomorrow.
  project: 'qlib/run/daily.py is the production entry point: seven ordered steps, each with an explicit
    success condition, and three checks for the failures that do not raise exceptions.'
- day: 324
  date: '2027-06-26'
  weekday: Saturday
  week: 47
  phase: Production
  kind: study
  title: Logging for the questions you will ask in March
  why: The purpose of a log is not to record that something happened but to let you reconstruct why a
    position was what it was, six weeks later, without rerunning anything.
  objectives:
  - Log structured records that let you reconstruct any day's decisions without rerunning the pipeline.
  - Answer three specific reconstruction questions from the log alone.
  tasks:
  - text: 'Convert your logging to structured records: one line per event as JSON, with a run identifier,
      a step name, a timestamp, and the numbers rather than a formatted sentence. Include the input row
      counts, the signal summary statistics, the target positions and the orders generated. A log you
      have to parse with a regular expression is a log you will not use.'
    minutes: 35
  - text: 'Test it against real questions: why did the book hold this position on that date, what did
      the signal look like the day the pipeline produced no orders, and how long did each step take across
      the last month. If any of the three cannot be answered from the log alone, add what is missing now.'
    minutes: 25
  resources:
  - label: NautilusTrader documentation
    url: https://nautilustrader.io/docs/
    kind: tool
  - label: DuckDB documentation
    url: https://duckdb.org/docs/current/
    kind: tool
  deliverable: Structured logging in place, with three reconstruction questions answered from the log
    alone.
  checkpoint: From your logs alone, can you say why the book held a particular position on a particular
    day? Demonstrate it.
  prep_for_tomorrow:
  - List the four things most likely to break in your pipeline over a year of unattended running.
  - For each, say how you would find out and how long it would take.
  - If any answer is that you would notice eventually, mark it.
  project: The production run emits structured JSON logs with run identifiers, per-step timings and the
    numbers behind each decision, so any day's positions can be reconstructed from the log without rerunning
    the pipeline.
- day: 325
  date: '2027-06-27'
  weekday: Sunday
  week: 47
  phase: Production
  kind: study
  title: Monitoring the four things that actually break
  why: Monitoring everything produces alerts you ignore, and the list you wrote last night is short enough
    that each item can have a real check behind it.
  objectives:
  - Implement a monitor for each of the four failure modes, with a threshold you can defend.
  - Say what each monitor's false positive rate is and why you chose that threshold.
  tasks:
  - text: 'Implement the four: data freshness against the exchange calendar, position drift between intended
      and actual, fill price against the expected price, and signal values against their historical distribution.
      Each returns a status and a number rather than a boolean, so a near-miss is visible.'
    minutes: 35
  - text: 'Set the thresholds from history rather than by feel: run each monitor over your backtest period
      and choose a threshold with a false positive rate you would tolerate, stated as alerts per month.
      A monitor that would have fired forty times last year is one you will disable in February.'
    minutes: 25
  resources:
  - label: exchange_calendars — 50+ exchange trading calendars
    url: https://github.com/gerrymanoim/exchange_calendars
    kind: repo
  - label: Alpaca — paper trading documentation
    url: https://docs.alpaca.markets/docs/paper-trading
    kind: tool
  deliverable: Four monitors implemented with thresholds calibrated to a stated alerts-per-month rate.
  checkpoint: Your position monitor would have fired 40 times last year. What do you do, and what does
    that tell you about the threshold?
  prep_for_tomorrow:
  - Write down what you would actually do at 6 am if each of your four monitors fired.
  - If the answer for any is unclear, that is the one to write up first.
  - Four short answers.
  project: Four monitors with thresholds calibrated against historical data run alongside the daily pipeline,
    each reporting a number rather than a boolean so that near-misses are visible before they become failures.
- day: 326
  date: '2027-06-28'
  weekday: Monday
  week: 47
  phase: Production
  kind: study
  title: Alerting, and the runbook written before you need it
  why: An alert with no documented response is an interruption rather than a control, and the runbook
    is worth writing now because the moment you need it is the moment you cannot think clearly.
  objectives:
  - Route alerts to somewhere you will see them, with a severity that distinguishes act-now from read-later.
  - 'Write a runbook entry for each monitor: symptom, likely causes in order, diagnostic commands, and
    the safe action.'
  tasks:
  - text: 'Wire the alerting: email or push for the two severities that need it, with a daily digest for
      the rest. Test each path by triggering it deliberately, since an untested alert path is the standard
      way a monitor fails silently.'
    minutes: 25
  - text: 'Write the runbook: one page per monitor with the symptom, the likely causes ranked, the exact
      commands to run to diagnose, and the safe action, which is usually to flatten or to hold rather
      than to guess. Include the decision rule for when to stop the system entirely.'
    minutes: 35
  resources:
  - label: Alpaca — paper trading documentation
    url: https://docs.alpaca.markets/docs/paper-trading
    kind: tool
  - label: Docker — get started
    url: https://docs.docker.com/get-started/
    kind: course
  deliverable: Tested alert routing plus a runbook with one page per monitor including a stop-the-system
    decision rule.
  checkpoint: Your fill-price monitor fires at 9:35 am. Read your own runbook and say what you do in the
    next five minutes.
  prep_for_tomorrow:
  - Compare your intended portfolio from yesterday's run against what the broker says you actually hold.
  - They will differ. Write down every difference.
  - Do not fix anything; tomorrow is about explaining them.
  project: Alerts are routed by severity and every one has a runbook entry with ranked causes, diagnostic
    commands and a safe action, written before the first real incident rather than after it.
- day: 327
  date: '2027-06-29'
  weekday: Tuesday
  week: 47
  phase: Production
  kind: study
  title: Reconciliation, and explaining every difference
  why: The intended and actual portfolios always differ, and a system that cannot explain the difference
    is one where a real error hides among the expected ones.
  objectives:
  - Produce a daily reconciliation report where every difference between intended and actual positions
    is categorised.
  - State what you do when a difference cannot be explained.
  tasks:
  - text: 'Build the report in qlib/run/reconcile.py: intended against actual positions and cash, with
      each difference attributed to a known cause such as a partial fill, a rejected order, a rounding
      to whole shares, a corporate action, or a fee. Anything left over goes into an unexplained bucket,
      and that bucket being non-empty is the alert.'
    minutes: 35
  - text: 'Reconcile the cash separately, because it catches different errors: starting cash plus fills
      plus fees plus dividends should equal ending cash exactly. Any discrepancy here is arithmetic rather
      than judgement, so the tolerance is a cent rather than a percentage.'
    minutes: 25
  resources:
