- day: 289
  date: '2027-05-22'
  weekday: Saturday
  week: 42
  phase: Microstructure
  kind: study
  title: Kyle's lambda, and the equilibrium that produces linearity
  why: The most cited model in microstructure, and its content is that a strategic informed trader and
    a rational market maker together produce a price that moves linearly in net order flow.
  objectives:
  - State what lambda measures and what determines its size in the model.
  - Derive or follow the linear equilibrium and say what the informed trader is trading off.
  tasks:
  - text: 'Read the single-period Kyle model in the original paper as far as the equilibrium, and follow
      the fixed point: the market maker''s pricing rule is linear given the informed trader''s strategy,
      and the informed trader''s optimal strategy is linear given the pricing rule. The fixed point of
      those two is the equilibrium, and the algebra is a page.'
    minutes: 35
  - text: 'Interpret lambda: it is the price move per unit of net order flow, it rises with the informed
      trader''s information advantage and falls with the amount of noise trading. The second dependence
      is the useful one, because it says liquidity is supplied by uninformed volume rather than by market
      makers'' willingness.'
    minutes: 25
  resources:
  - label: Kyle (1985) — Continuous Auctions and Insider Trading
    url: https://people.duke.edu/~qc2/BA532/1985%20EMA%20Kyle.pdf
    kind: paper
