- day: 239
  date: '2027-04-02'
  weekday: Friday
  week: 35
  phase: Derivatives
  kind: study
  title: Brownian motion is a random walk you took a limit of
  why: The furthest material from your training starts here, and it starts from an object you already
    know well, which is the only reason six weeks is enough.
  objectives:
  - State the three defining properties of Brownian motion and say which of them a scaled random walk
    satisfies in the limit.
  - Say why the paths are continuous everywhere and differentiable nowhere, in terms of the scaling between
    time and displacement.
  tasks:
  - text: Read the first chapter of Etheridge's Oxford stochastic calculus notes, on the construction
      of Brownian motion from a random walk. It is written for people who know probability, which saves
      you the two weeks a finance-first treatment would cost.
    minutes: 30
  - text: 'Build the limit yourself: simulate a symmetric random walk with n steps over a fixed time interval,
      scaling the step size as the square root of the time increment, for n of 100, 10,000 and 1,000,000.
      Plot all three paths on the same time axis and note that the picture stops changing qualitatively.'
    minutes: 20
  - text: 'Show the non-differentiability numerically: for one path, compute the ratio of the increment
      to the time step at increasingly fine resolution, and watch it diverge. The square-root scaling
      is exactly what makes that ratio blow up.'
    minutes: 10
  resources:
  - label: Oxford — Etheridge, Stochastic Calculus for Finance (lecture notes)
    url: https://www.stats.ox.ac.uk/~etheridg/finmath/index.html
    kind: course
  - label: MIT 15.070J — Advanced Stochastic Processes, lecture notes
    url: https://ocw.mit.edu/courses/15-070j-advanced-stochastic-processes-fall-2013/pages/lecture-notes/
    kind: course
  deliverable: notebooks/day-239-brownian.ipynb with the scaling limit at three resolutions and the divergence
    of the difference quotient demonstrated.
  checkpoint: State the three defining properties of Brownian motion, and say which one gives you the
    square-root-of-time scaling.
  prep_for_tomorrow:
  - For one simulated Brownian path, compute the sum of squared increments at partition sizes of 100,
    1,000 and 10,000.
  - Then compute the sum of absolute increments at the same partition sizes.
  - Write down the six numbers. One column converges and one does not.
- day: 240
  date: '2027-04-03'
  weekday: Saturday
  week: 35
  phase: Derivatives
  kind: study
  title: Quadratic variation is the entire difference from calculus
  why: The six numbers you wrote down last night contain the whole reason stochastic calculus exists,
    and everything in the next five weeks is a consequence of one of those two columns being non-zero.
  objectives:
  - State what the quadratic variation of Brownian motion over an interval equals, and demonstrate it
    numerically.
  - Say why a smooth function has zero quadratic variation and what that implies for the chain rule.
  tasks:
  - text: 'Interpret your numbers: the sum of squared increments converges to the length of the interval,
      and the sum of absolute increments diverges. Repeat both for a smooth function such as a sine wave
      over the same interval and confirm the squared sum goes to zero there. That contrast is the definition
      of the problem.'
    minutes: 25
  - text: Read the section of the CMU stochastic calculus notes on quadratic variation, then write the
      informal identity that the square of a Brownian increment behaves like the time increment. This
      is the one line you will use in every derivation for the next month, so write it somewhere permanent.
    minutes: 25
  - text: 'Check the corollary: the cross-variation of Brownian motion with time, and the quadratic variation
      of time itself, are both zero. Verify both numerically so that the three rules are facts you have
      seen rather than a table you memorised.'
    minutes: 10
  resources:
  - label: CMU — Iyer, Stochastic Calculus for Finance (notes)
    url: https://www.math.cmu.edu/~gautam/sj/teaching/2021-22/944-scalc-finance1/pdfs/notes-tablet.pdf
    kind: reference
  - label: Oxford — Etheridge, Stochastic Calculus for Finance (lecture notes)
    url: https://www.stats.ox.ac.uk/~etheridg/finmath/index.html
    kind: course
  deliverable: notebooks/day-240-quadratic-variation.ipynb with quadratic variation converging to the
    interval length for Brownian motion and to zero for a smooth function.
  checkpoint: What is the quadratic variation of Brownian motion over [0,T], and why does an ordinary
    differentiable function have none?
  prep_for_tomorrow:
  - Try to integrate a Brownian path against itself using a Riemann sum, evaluating the integrand at the
    left endpoint of each interval, and then at the right endpoint.
  - The two answers differ and the difference does not vanish as the partition refines.
  - Compute both and write down the gap.
- day: 241
  date: '2027-04-04'
  weekday: Sunday
  week: 35
  phase: Derivatives
  kind: study
  title: The Itô integral, and why the left endpoint is a choice
  why: The gap you found last night does not shrink, which means a stochastic integral is not defined
    until you say where in each interval you evaluate, and the financial reason for choosing the left
    is worth more than the mathematical one.
  objectives:
  - Say why the left-endpoint convention is the one that makes financial sense, in terms of what a trader
    knows when.
  - State the Itô isometry and use it to compute the variance of a simple stochastic integral.
  tasks:
  - text: Read the construction of the Itô integral in the CMU or Etheridge notes, as far as the isometry.
      The construction is from simple predictable integrands, which is exactly a trading strategy that
      holds a fixed position between rebalances, and that correspondence is worth making explicit as you
      read.
    minutes: 30
  - text: 'Make the financial argument in writing: the left-endpoint convention means your position over
      an interval is decided before the interval''s price change is known. Any other convention lets the
      strategy see the increment it is about to profit from, which is the look-ahead you spent phase 5
      eliminating, in continuous time.'
    minutes: 20
  - text: 'Use the isometry once: compute the variance of the integral of a deterministic function against
      Brownian motion, and check it by simulation.'
    minutes: 10
  resources:
  - label: CMU — Iyer, Stochastic Calculus for Finance (notes)
    url: https://www.math.cmu.edu/~gautam/sj/teaching/2021-22/944-scalc-finance1/pdfs/notes-tablet.pdf
    kind: reference
  - label: NYU Courant — Goodman, Stochastic Calculus (course materials)
    url: https://math.nyu.edu/~goodman/teaching/StochCalc2020/material.html
    kind: course
  deliverable: notebooks/day-241-ito-integral.ipynb with the endpoint discrepancy quantified and the Itô
    isometry verified by simulation.
  checkpoint: Why does the Itô integral evaluate the integrand at the left endpoint, and what would the
    other choice mean for a trading strategy?
  prep_for_tomorrow:
  - Write the ordinary chain rule for a function of a smooth path.
  - Then write what you think the extra term would be for a Brownian path, using the identity from day
    240.
  - You will probably get it right, and tomorrow you derive it properly.
- day: 242
  date: '2027-04-05'
  weekday: Monday
  week: 35
  phase: Derivatives
  kind: study
  title: Itô's lemma is a Taylor expansion with one extra term
  why: The single most used result in derivatives pricing, and given quadratic variation it is a two-line
    derivation rather than a mystery, which is why the last three days were spent on quadratic variation.
  objectives:
  - Derive Itô's lemma from a second-order Taylor expansion and say in words what the extra term is doing.
  - Apply it to obtain the dynamics of the log of a geometric Brownian motion, and connect the result
    to volatility drag.
  tasks:
  - text: 'Derive it: expand a twice-differentiable function of a stochastic process to second order,
      substitute the quadratic variation identity for the squared increment, and drop the terms that vanish.
      Do it on paper without looking, then check against the notes.'
    minutes: 25
  - text: 'Apply it to the log: with a process whose relative increments have constant drift and volatility,
      the log has drift reduced by half the variance. That result is exactly your day 31 arithmetic-geometric
      gap, arrived at from a completely different direction, and noticing that is worth more than either
      derivation alone.'
    minutes: 20
  - text: 'Verify by simulation: simulate the process and its log, and confirm the drift of the log matches
      the lemma''s prediction to within sampling error.'
    minutes: 15
  resources:
  - label: MIT 18.S096 — Topics in Mathematics with Applications in Finance
    url: https://ocw.mit.edu/courses/18-s096-topics-in-mathematics-with-applications-in-finance-fall-2013/
    kind: course
  - label: Oxford — Etheridge, Stochastic Calculus for Finance (lecture notes)
    url: https://www.stats.ox.ac.uk/~etheridg/finmath/index.html
    kind: course
  deliverable: notebooks/day-242-itos-lemma.ipynb with the derivation written out and the log drift verified
    by simulation.
  checkpoint: State Itô's lemma and say, in words, what the extra term is doing that ordinary calculus
    does not have.
  prep_for_tomorrow:
  - 'Write down three stochastic differential equations: geometric Brownian motion, an Ornstein-Uhlenbeck
    process, and a square-root diffusion.'
  - You met the second one on day 82 without the notation.
  - For each, say in one clause what the drift term is doing.
- day: 243
  date: '2027-04-06'
  weekday: Tuesday
  week: 35
  phase: Derivatives
  kind: study
  title: Three SDEs you will meet, and what each one enforces
  why: Only a handful of stochastic differential equations appear in practice, each chosen because its
    drift enforces a property the modelled quantity must have, and knowing which is which is most of what
    you need.
  objectives:
  - For each of the three processes, say what property of the modelled quantity the drift enforces.
  - Solve geometric Brownian motion and the Ornstein-Uhlenbeck process explicitly using Itô's lemma.
  tasks:
  - text: Solve both explicitly. Geometric Brownian motion by applying Itô to the log, and Ornstein-Uhlenbeck
      by applying Itô to an exponentially weighted transformation of the process. Both are one page each
      and doing them is what makes the notation stop being an obstacle.
    minutes: 35
  - text: 'Connect each to something you have already measured: geometric Brownian motion enforces positivity,
      Ornstein-Uhlenbeck enforces mean reversion and is your day 82 spread model, and the square-root
      diffusion enforces non-negativity of a variance, which is why it appears in stochastic volatility
      models in week 39.'
    minutes: 20
  - text: Write the stationary distribution of the Ornstein-Uhlenbeck process and check it against the
      empirical distribution of the spread you fitted in week 12.
    minutes: 10
