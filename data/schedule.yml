      where mean squared error and QLIKE give opposite rankings, and explain it in terms of how each loss
      penalises under-prediction versus over-prediction.'
    minutes: 30
  - text: Run the Mincer-Zarnowitz regression for each model, regressing realised variance on the forecast,
      and check whether the intercept is zero and the slope is one. A slope well below one means the forecast
      is too variable and should be shrunk, which is a fixable defect rather than a verdict.
    minutes: 25
